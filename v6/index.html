<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>禅ノート v6 - コンバットノート</title>
<style>
:root{--bg:#1c1b19;--panel:#211f1c;--paper:#eae4d8;--muted:#8c8577;--line:#33312c;--hanko:#b23a2e;--ai:#2a2723}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper);font-family:"Noto Serif JP","Yu Mincho",serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea{font:inherit}.app{width:min(760px,100%);margin:auto;min-height:100dvh;padding:18px 16px 150px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:13px;letter-spacing:.14em;color:var(--muted)}.status{font:10px monospace;color:var(--muted)}.gear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:50%;width:34px;height:34px}.hero{text-align:center;padding:18vh 20px 10vh}.hero h1{font-size:28px;font-weight:400;letter-spacing:.08em;margin:0 0 12px}.hero p{color:var(--muted);font-size:13px;line-height:1.8}.start{margin-top:28px;background:none;border:1px solid var(--hanko);color:var(--paper);padding:12px 20px;border-radius:4px}.chat{display:flex;flex-direction:column;gap:22px}.turn{max-width:92%;line-height:1.9;font-size:16px;white-space:pre-wrap}.turn.me{align-self:flex-end;color:var(--paper)}.turn.ai{align-self:flex-start;color:#cfc8bc}.role{display:block;font:9px monospace;letter-spacing:.12em;color:var(--muted);margin-bottom:5px}.composer{position:fixed;left:0;right:0;bottom:0;background:rgba(28,27,25,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.composerInner{width:min(760px,100%);margin:auto;display:flex;gap:8px;align-items:flex-end}.input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:5px;min-height:48px;max-height:140px;padding:12px;resize:none;outline:none}.send,.mic,.end{border:1px solid var(--line);background:none;color:var(--muted);border-radius:5px;min-height:48px;padding:0 13px}.send{color:var(--paper)}.end{color:var(--hanko)}button:disabled{opacity:.35}.overlay{position:fixed;inset:0;background:rgba(10,10,9,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.open{display:flex}.modal{width:min(520px,100%);max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:6px}.modal h2{font-size:17px;font-weight:400;margin:0 0 16px}.field{margin-bottom:13px}.field label{display:block;font:10px monospace;color:var(--muted);margin-bottom:6px}.field input{width:100%;background:#171614;border:1px solid var(--line);color:var(--paper);padding:10px;border-radius:4px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.btn{border:1px solid var(--line);background:none;color:var(--paper);padding:9px 13px;border-radius:4px}.primary{border-color:var(--hanko);background:var(--hanko)}.candidate{border-top:1px solid var(--line);padding:14px 0}.candidate:first-child{border-top:0}.candidate label{font-size:12px;color:var(--muted)}.candidate input[type=text]{margin-top:7px}.preview{white-space:pre-wrap;background:#171614;border:1px solid var(--line);padding:14px;line-height:1.75;font-size:13px;max-height:45dvh;overflow:auto}.hidden{display:none!important}.notice{font-size:11px;color:var(--muted);line-height:1.7;margin-top:12px}.ok{color:#91b99c}.err{color:#d58b83}@media(max-width:560px){.app{padding-left:14px;padding-right:14px}.turn{max-width:96%;font-size:15px}.end{padding:0 9px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">禅ノート v6</div><div style="display:flex;gap:9px;align-items:center"><span class="status" id="status">待機中</span><button class="gear" id="gear">⚙</button></div></div>
  <section class="hero" id="hero"><h1>コンバットノート</h1><p>答えを出すためではなく、<br>問い返しながら、自分の言葉を掘る。</p><button class="start" id="start">話し始める</button></section>
  <section class="chat hidden" id="chat"></section>
</div>
<div class="composer hidden" id="composer"><div class="composerInner"><button class="mic" id="mic">🎙</button><textarea class="input" id="input" placeholder="話す……"></textarea><button class="send" id="send">送信</button><button class="end" id="end">終了</button></div></div>

<div class="overlay" id="settingsOverlay"><div class="modal"><h2>接続設定</h2>
  <div class="field"><label>GEMINI API KEY</label><input id="geminiKey" type="password"></div>
  <div class="field"><label>MODEL</label><input id="model" value="gemini-2.5-flash-lite"></div>
  <div class="field"><label>GITHUB TOKEN</label><input id="ghToken" type="password"></div>
  <div class="field"><label>OWNER</label><input id="owner" value="plzsayyes3"></div>
  <div class="field"><label>REPOSITORY</label><input id="repo" value="mynotebook"></div>
  <div class="field"><label>FOLDER</label><input id="folder" value="00_inbox"></div>
  <div class="field"><label>BRANCH</label><input id="branch" value="main"></div>
  <div class="notice">設定はこの端末のブラウザに保存されます。</div>
  <div class="row"><button class="btn" id="settingsClose">閉じる</button><button class="btn primary" id="settingsSave">保存</button></div>
</div></div>

<div class="overlay" id="correctionOverlay"><div class="modal"><h2>音声認識の確認</h2><div class="notice">誤認識と思われる箇所だけ候補にしています。直すものだけチェックしてください。</div><div id="candidateList"></div><div class="row"><button class="btn" id="skipCorrection">修正しない</button><button class="btn primary" id="applyCorrection">確定</button></div></div></div>

<div class="overlay" id="previewOverlay"><div class="modal"><h2>保存するノート</h2><div class="preview" id="preview"></div><div id="saveMsg" class="notice"></div><div class="row"><button class="btn" id="previewClose">戻る</button><button class="btn primary" id="saveGithub">GitHubへ保存</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const state={active:false,busy:false,turns:[],title:'コンバットノート',candidates:[],markdown:''};
const PROMPT=`あなたは「コンバットノート」の対話相手です。目的はユーザー自身の言葉で考えを掘り下げることです。必ず、ユーザーの発言に短く反応し、その内容に沿った問いを1つだけ返してください。無理に結論へ持っていかず、行動提案へ誘導せず、求められない限り長い説明や助言をしないでください。基本形は「短い受け止め＋問い1つ」です。一度の返答に質問は1つだけ。ユーザーの言葉を勝手に言い換えて断定しないでください。`;
function setStatus(x){$('status').textContent=x}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadSettings(){let g={},a={};try{g=JSON.parse(localStorage.getItem('zen:settings:github')||'{}')}catch{}try{a=JSON.parse(localStorage.getItem('zen:settings:gemini')||'{}')}catch{}$('ghToken').value=g.token||'';$('owner').value=g.owner||'plzsayyes3';$('repo').value=g.repo||'mynotebook';$('folder').value=g.folder||'00_inbox';$('branch').value=g.branch||'main';$('geminiKey').value=a.key||'';$('model').value=a.model||'gemini-2.5-flash-lite'}
function saveSettings(){localStorage.setItem('zen:settings:github',JSON.stringify({token:$('ghToken').value.trim(),owner:$('owner').value.trim(),repo:$('repo').value.trim(),folder:$('folder').value.trim(),branch:$('branch').value.trim()}));localStorage.setItem('zen:settings:gemini',JSON.stringify({key:$('geminiKey').value.trim(),model:$('model').value.trim()}));$('settingsOverlay').classList.remove('open')}
function addTurn(role,text){state.turns.push({role,text});const d=document.createElement('div');d.className='turn '+(role==='user'?'me':'ai');d.innerHTML=`<span class="role">${role==='user'?'私':'AI'}</span>${esc(text).replace(/\n/g,'<br>')}`;$('chat').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'})}
function start(){loadSettings();if(!$('geminiKey').value.trim()){$('settingsOverlay').classList.add('open');return}state.active=true;state.turns=[];$('hero').classList.add('hidden');$('chat').classList.remove('hidden');$('composer').classList.remove('hidden');$('chat').innerHTML='';addTurn('assistant','今日はどんなことを話したいですか？');setStatus('対話中');$('input').focus()}
function geminiSettings(){let a={};try{a=JSON.parse(localStorage.getItem('zen:settings:gemini')||'{}')}catch{}return a}
async function gemini(contents,systemInstruction=PROMPT,json=false){const s=geminiSettings();if(!s.key)throw new Error('Gemini API Keyがありません');const model=s.model||'gemini-2.5-flash-lite';const body={systemInstruction:{parts:[{text:systemInstruction}]},contents,generationConfig:{temperature:.7,maxOutputTokens:240,thinkingConfig:{thinkingBudget:0}}};if(json)body.generationConfig.responseMimeType='application/json';const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.key},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data?.error?.message||'Gemini API error');return (data.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim()}
async function send(){const text=$('input').value.trim();if(!text||state.busy)return;if(text==='ノート終了'){end();return}state.busy=true;$('send').disabled=true;$('input').disabled=true;$('input').value='';addTurn('user',text);setStatus('考え中');try{const contents=state.turns.map(t=>({role:t.role==='assistant'?'model':'user',parts:[{text:t.text}]}));const reply=await gemini(contents);addTurn('assistant',reply);setStatus('対話中')}catch(e){setStatus('エラー');alert(e.message)}finally{state.busy=false;$('send').disabled=false;$('input').disabled=false;$('input').focus()}}
async function end(){if(state.busy||!state.active)return;state.active=false;state.busy=true;$('composer').classList.add('hidden');setStatus('校正中');const only=state.turns.filter(t=>t.role==='user').map((t,i)=>`[${i+1}] ${t.text}`).join('\n\n');const sys=`音声入力ノートの校正候補抽出担当です。ユーザー発言だけを対象に、音声認識の誤変換である可能性が比較的高い箇所だけを抽出してください。自然な文章へ全面的に書き換えてはいけません。意味が通る表現、単なる口語や言い回しは候補にしません。同時に対話全体の短い日本語タイトルを作ってください。JSONのみで {"title":"短いタイトル","candidates":[{"original":"原文中の完全一致文字列","suggestion":"修正候補","reason":"短い理由"}]} の形式。originalは必ず原文に完全一致。`;
try{const raw=await gemini([{role:'user',parts:[{text:only}]}],sys,true);const d=JSON.parse(raw);state.title=d.title||'コンバットノート';state.candidates=Array.isArray(d.candidates)?d.candidates:[]}catch(e){state.title='コンバットノート';state.candidates=[]}renderCandidates();$('correctionOverlay').classList.add('open');state.busy=false;setStatus('確認')}
function renderCandidates(){const box=$('candidateList');box.innerHTML='';if(!state.candidates.length){box.innerHTML='<div class="notice">修正候補はありませんでした。</div>';return}state.candidates.forEach((c,i)=>{const d=document.createElement('div');d.className='candidate';d.innerHTML=`<label><input type="checkbox" id="c${i}"> ${esc(c.original)} →</label><input type="text" id="s${i}" value="${esc(c.suggestion)}"><div class="notice">${esc(c.reason||'')}</div>`;box.appendChild(d)})}
function makeMarkdown(apply){const turns=state.turns.map(t=>({...t}));if(apply){for(const t of turns){if(t.role!=='user')continue;state.candidates.forEach((c,i)=>{const cb=$('c'+i);if(cb?.checked&&t.text.includes(c.original))t.text=t.text.split(c.original).join($('s'+i).value)})}}const a=[`# ${state.title}`,''];for(const t of turns){a.push(t.role==='user'?'**私：**':'**AI：**');a.push(t.text.trim());a.push('')}state.markdown=a.join('\n').trim()+'\n';$('preview').textContent=state.markdown;$('correctionOverlay').classList.remove('open');$('previewOverlay').classList.add('open');setStatus('保存待ち')}
function ts(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
function b64utf8(s){const bytes=new TextEncoder().encode(s);let b='';bytes.forEach(x=>b+=String.fromCharCode(x));return btoa(b)}
async function saveGithub(){let s={};try{s=JSON.parse(localStorage.getItem('zen:settings:github')||'{}')}catch{}if(!s.token){$('saveMsg').innerHTML='<span class="err">GitHub Tokenを設定してください。</span>';return}const name=ts()+'-voice.md',folder=(s.folder||'00_inbox').replace(/^\/+|\/+$/g,''),path=folder+'/'+name;$('saveGithub').disabled=true;$('saveMsg').textContent='保存中……';const r=await fetch(`https://api.github.com/repos/${s.owner}/${s.repo}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+s.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Zen v6 combat note: '+state.title,content:b64utf8(state.markdown),branch:s.branch||'main'})});const d=await r.json();$('saveGithub').disabled=false;if(!r.ok){$('saveMsg').innerHTML='<span class="err">'+esc(d.message||'保存失敗')+'</span>';return}$('saveMsg').innerHTML='<span class="ok">保存しました: '+esc(path)+'</span>';setStatus('保存済み')}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;if(SR){rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=false;let base='';rec.onstart=()=>{base=$('input').value;$('mic').textContent='■';setStatus('音声入力中')};rec.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const x=e.results[n][0].transcript;e.results[n].isFinal?f+=x:i+=x}$('input').value=base+f+i};rec.onend=()=>{$('mic').textContent='🎙';if(state.active)setStatus('対話中')}}else{$('mic').disabled=true}
$('gear').onclick=()=>{loadSettings();$('settingsOverlay').classList.add('open')};$('settingsClose').onclick=()=>$('settingsOverlay').classList.remove('open');$('settingsSave').onclick=saveSettings;$('start').onclick=start;$('send').onclick=send;$('end').onclick=end;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('mic').onclick=()=>{if(!rec)return;try{rec.start()}catch{try{rec.stop()}catch{}}};$('skipCorrection').onclick=()=>makeMarkdown(false);$('applyCorrection').onclick=()=>makeMarkdown(true);$('previewClose').onclick=()=>{$('previewOverlay').classList.remove('open');$('composer').classList.remove('hidden');state.active=true;setStatus('対話中')};$('saveGithub').onclick=saveGithub;loadSettings();
</script>
</body>
</html>
