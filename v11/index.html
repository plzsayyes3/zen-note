<body>

<script type="module">

const editor=document.getElementById('editor'),overlay=document.getElementById('overlay'),toast=document.getElementById('toast');
const SETTINGS_KEY='zen:settings:github',MODE_KEY='zen-note-v11-mode',BGM_KEY='zen-note-v11-overdrive-bgm',DRAFT_KEY='zen-note-v11-draft',DEFAULTS={owner:'plzsayyes3',repo:'mynotebook',branch:'main',folder:'00_inbox'};
let combo=0,lastKeyAt=0,isComposing=false,lastValue='',draftTimer=0,animFrame=0,sending=false,activeTypingMs=0,lastTypingKeyAt=0,frameTypingMs=0,frameLastKeyAt=0,stars=[],starResetTimer=0,starMax=5000;
const modeSelect=document.getElementById('modeSelect'),bgmSelect=document.getElementById('bgmSelect');const fields={token:document.getElementById('token'),owner:document.getElementById('owner'),repo:document.getElementById('repo'),branch:document.getElementById('branch'),folder:document.getElementById('folder')};
const readSettings=()=>{try{return {...DEFAULTS,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{return {...DEFAULTS}}};
const writeSettings=value=>localStorage.setItem(SETTINGS_KEY,JSON.stringify(value));

const saveDraft=()=>{try{localStorage.setItem(DRAFT_KEY,editor.value)}catch{}};const scheduleDraft=()=>{clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,900)};
const starCanvas=document.getElementById('starCanvas'),starCtx=starCanvas.getContext('2d',{alpha:true});
const overdrive=new OverdriveController({editor,canvas:document.getElementById('fxCanvas'),hud:document.getElementById('overdriveHud'),comboEl:document.getElementById('odCombo'),stageEl:document.getElementById('odStage')});
const darkQuery=window.matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>darkQuery.matches;
function resizeStarCanvas(){
  const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);
  starCanvas.width=Math.round(w*dpr);starCanvas.height=Math.round(h*dpr);starCanvas.style.width=w+'px';starCanvas.style.height=h+'px';
  starCtx.setTransform(dpr,0,0,dpr,0,0);starMax=Math.max(5000,Math.floor((w*h)/180));drawStars();
}
function spawnStars(count){
  if(!isDark()||stars.length>=starMax)return;
  const amount=Math.min(count,starMax-stars.length);
  for(let i=0;i<amount;i++){
    const warm=Math.random();
    stars.push({x:Math.random(),y:Math.random(),r:.38+Math.random()*1.02,a:.38+Math.random()*.54,c:warm<.10?'255,232,208':warm<.24?'205,224,255':warm<.31?'245,230,255':'248,250,255'});

  drawStars();

    starResetTimer=setTimeout(()=>{
      document.body.classList.add('universe-reset');
      setTimeout(()=>{stars=[];activeTypingMs=0;lastTypingKeyAt=0;document.body.classList.remove('universe-reset');starResetTimer=0;drawStars()},1200);
    },1800);
  }
}
function drawStars(){
  const w=innerWidth,h=innerHeight,fill=starFillLevel(stars.length,starMax),growth=1+fill*2.25;
  document.documentElement.style.setProperty('--star-fill',fill.toFixed(4));
  const whiteout=fill<.70?0:Math.min(1,Math.pow((fill-.70)/.30,1.55));
  document.documentElement.style.setProperty('--whiteout',whiteout.toFixed(4));
  document.body.classList.toggle('whiteout',isDark()&&fill>.82);
  starCtx.clearRect(0,0,w,h);
  if(!isDark())return;
  starCtx.save();
  for(const s of stars){
    starCtx.beginPath();starCtx.fillStyle='rgba('+s.c+','+Math.min(1,s.a+fill*.18)+')';

    starCtx.fillStyle='rgba(214,225,255,'+Math.min(.22,(fill-.42)*.30)+')';
    starCtx.fillRect(0,0,w,h);starCtx.filter='none';
  }

    starCtx.globalCompositeOperation='source-over';

  }

function renderFlow(now=Date.now()){const level=flowLevel(combo,lastKeyAt,now);document.documentElement.style.setProperty('--flow',level.toFixed(4));if(level===0&&lastKeyAt&&now-lastKeyAt>=8000){combo=0;lastKeyAt=0}const frameProgress=frameProgressFromTypingMs(frameTypingMs),frameColor=frameColorAt(frameProgress),frameAlpha=frameOpacityAt(frameProgress);document.documentElement.style.setProperty('--frame-rgb',frameColor.join(','));document.documentElement.style.setProperty('--frame-alpha',frameAlpha.toFixed(3));document.documentElement.style.setProperty('--frame-glow',(0.05+frameProgress*.18).toFixed(3));animFrame=requestAnimationFrame(()=>renderFlow(Date.now()))}
function sentenceBurst(){document.body.classList.remove('sentence');void document.body.offsetWidth;document.body.classList.add('sentence');setTimeout(()=>document.body.classList.remove('sentence'),760)}
editor.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();sendToGithub();return}if(!isTypingKey(event))return;const now=Date.now();if(document.body.dataset.mode==='overdrive'){overdrive.hit(now);return}combo=Math.min(60,combo+1);lastKeyAt=now;activeTypingMs=activeTypingMsAfterKey(lastTypingKeyAt,now,activeTypingMs);lastTypingKeyAt=now;frameTypingMs=activeTypingMsAfterKey(frameLastKeyAt,now,frameTypingMs);frameLastKeyAt=now;spawnStars(starsPerKey(activeTypingMs));});
editor.addEventListener('compositionstart',()=>{isComposing=true});editor.addEventListener('compositionend',()=>{isComposing=false;queueMicrotask(handleTextChange)});editor.addEventListener('input',()=>{scheduleDraft();if(!isComposing)handleTextChange()});
function handleTextChange(){const next=editor.value;let inserted='',start=0;while(start<lastValue.length&&start<next.length&&lastValue[start]===next[start])start++;let oldEnd=lastValue.length-1,newEnd=next.length-1;while(oldEnd>=start&&newEnd>=start&&lastValue[oldEnd]===next[newEnd]){oldEnd--;newEnd--}if(newEnd>=start)inserted=next.slice(start,newEnd+1);lastValue=next;if(sentenceCompleted(inserted)){sentenceBurst();if(document.body.dataset.mode==='overdrive')overdrive.sentenceBurst()}}
function currentMode(){try{return localStorage.getItem(MODE_KEY)||'immersion'}catch{return 'immersion'}}function currentBgm(){try{return localStorage.getItem(BGM_KEY)==='on'}catch{return false}}function applyBgm(value){const on=!!value;bgmSelect.value=on?'on':'off';overdrive.setBgmEnabled(on);try{localStorage.setItem(BGM_KEY,on?'on':'off')}catch{}}function applyMode(mode){const next=mode==='overdrive'?'overdrive':'immersion';document.body.dataset.mode=next;modeSelect.value=next;overdrive.setEnabled(next==='overdrive');try{localStorage.setItem(MODE_KEY,next)}catch{}}function openSettings(){const s=readSettings();Object.keys(fields).forEach(k=>fields[k].value=s[k]||'');modeSelect.value=currentMode();bgmSelect.value=currentBgm()?'on':'off';overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}function closeSettings(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');editor.focus()}
document.getElementById('settingsOpen').addEventListener('click',openSettings);document.getElementById('settingsClose').addEventListener('click',closeSettings);document.getElementById('settingsSave').addEventListener('click',()=>{writeSettings(Object.fromEntries(Object.entries(fields).map(([k,el])=>[k,el.value.trim()])));applyBgm(bgmSelect.value==='on');applyMode(modeSelect.value);closeSettings();showToast('SAVED')});overlay.addEventListener('click',e=>{if(e.target===overlay)closeSettings()});document.addEventListener('keydown',event=>{if(event.ctrlKey&&!event.metaKey&&!event.altKey&&event.key.toLowerCase()==='q'){event.preventDefault();if(overlay.classList.contains('open'))closeSettings();else openSettings()}});
let lastTouchTap=0,lastTouchX=0,lastTouchY=0;
document.addEventListener('touchend',event=>{
  if(overlay.classList.contains('open')||event.changedTouches.length!==1)return;
  if(event.target.closest?.('.settings-trigger,.panel'))return;
  const touch=event.changedTouches[0],now=Date.now(),dt=now-lastTouchTap,dx=touch.clientX-lastTouchX,dy=touch.clientY-lastTouchY;
  if(dt>0&&dt<330&&dx*dx+dy*dy<2304){
    event.preventDefault();lastTouchTap=0;openSettings();return;
  }
  lastTouchTap=now;lastTouchX=touch.clientX;lastTouchY=touch.clientY;
},{passive:false});
const pad=(n,w=2)=>String(n).padStart(w,'0');function timestamp(){const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${pad(d.getMilliseconds(),3)}`}function b64Unicode(str){return btoa(unescape(encodeURIComponent(str)))}
async function sendToGithub(){if(sending)return;const text=editor.value.trimEnd();if(!text)return;const s=readSettings();if(!s.token){openSettings();showToast('TOKEN REQUIRED');return}sending=true;saveDraft();try{const folder=String(s.folder||DEFAULTS.folder).replace(/^\/+|\/+$/g,'');const path=`${folder}/${timestamp()}.md`;const response=await fetch(`https://api.github.com/repos/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'PUT',headers:{Authorization:`Bearer ${s.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:`Add ZEN v11 note ${new Date().toISOString()}`,content:b64Unicode(text+'\n'),branch:s.branch||DEFAULTS.branch})});if(!response.ok)throw new Error(`GitHub ${response.status}`);editor.value='';lastValue='';combo=0;lastKeyAt=0;saveDraft();sentenceBurst();showToast('SENT')}catch(error){console.error(error);showToast(String(error.message||error))}finally{sending=false;editor.focus()}}
try{editor.value=localStorage.getItem(DRAFT_KEY)||''}catch{}lastValue=editor.value;applyBgm(currentBgm());applyMode(currentMode());resizeStarCanvas();window.addEventListener('resize',resizeStarCanvas,{passive:true});darkQuery.addEventListener?.('change',drawStars);renderFlow();editor.focus();window.addEventListener('beforeunload',()=>{cancelAnimationFrame(animFrame);saveDraft()});
