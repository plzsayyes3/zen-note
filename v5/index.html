<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>禅ノート v5</title><style>:root{--bg:#1c1b19;--paper:#eae4d8;--muted:#8c8577;--focus:rgba(234,228,216,.28)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--paper);font-family:"Noto Serif JP",serif}.stream{position:fixed;inset:0;overflow:hidden;pointer-events:none}.column{position:absolute;inset:0;font-size:25em;line-height:1.2;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;will-change:transform}.char{position:absolute;left:50%;top:50%;width:1em;height:1.2em;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;transform:translate(-50%,-50%)}.char.old{transform:translate(-50%,calc(-50% - var(--offset)))}.focus{position:absolute;left:50%;top:50%;width:1.02em;height:1.02em;border:1px solid var(--focus);background:transparent;transform:translate(-50%,-50%);z-index:3;pointer-events:none}.editor{position:fixed;inset:0;opacity:0;caret-color:transparent;z-index:2}.status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font:11px monospace;color:var(--muted)}button{position:fixed;right:24px;bottom:16px;background:none;border:0;color:var(--muted);font:11px monospace}</style></head><body><div class="stream"><div class="column" id="column"><span class="focus" id="focus"></span></div></div><textarea class="editor" id="editor" autofocus spellcheck="false"></textarea><div class="status" id="count">0字</div><button id="save">投稿 ⌘↵</button><script>const e=document.querySelector('#editor'),c=document.querySelector('#column'),n=document.querySelector('#count'),D='zen:draft:current';function render(){c.querySelectorAll('.char').forEach(x=>x.remove());const a=Array.from(e.value.replace(/[\r\n]/g,''));const step=parseFloat(getComputedStyle(c).fontSize)*1.2;const frag=document.createDocumentFragment();a.forEach((ch,i)=>{const s=document.createElement('span');s.className='char old';s.textContent=ch;s.style.setProperty('--offset',(a.length-1-i)*step+'px');frag.appendChild(s)});c.insertBefore(frag,document.querySelector('#focus'));n.textContent=a.length+'字';localStorage.setItem(D,e.value)}e.oninput=render;e.onkeydown=x=>{if(x.key==='Enter'){x.preventDefault()}if((x.metaKey||x.ctrlKey)&&x.key==='Enter'){x.preventDefault();save()}};async function save(){const t=e.value.replace(/[\r\n]/g,'');if(!t.trim())return;let s;try{s=JSON.parse(localStorage.getItem('zen:settings:github')||'null')}catch{}if(!s?.token){alert('GitHub設定をv2で行ってください');return}const d=new Date(),p=x=>String(x).padStart(2,'0'),name=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()),folder=s.folder||'00_inbox',path=folder+'/'+name+'.md',b=btoa(unescape(encodeURIComponent(t)));const r=await fetch('https://api.github.com/repos/'+s.owner+'/'+s.repo+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+s.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Zen v5: '+t.slice(0,40),content:b,branch:s.branch||'main'})});if(!r.ok){alert('投稿に失敗しました');return}e.value='';localStorage.removeItem(D);render()}document.querySelector('#save').onclick=save;e.value=localStorage.getItem(D)||'';render();e.focus();</script></body></html>
