<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="禅ノートv4">
<title>禅ノート v4 - 自転車モード</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Zen+Old+Mincho:wght@600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ライトモードを既定にする(屋外の直射日光下での視認性を優先)。
     ダークは任意切替(右上のテーマボタン、選択はlocalStorageに保存)。 */
  :root{
    --bg:#F7F3EA;
    --paper:#211F1C;
    --muted:#6B6558;
    --hairline:#E1D9C8;
    --field-bg:#FFFFFF;
    --hanko:#B23A2E;
    --hanko-text:#FBF2E9;
    --hanko-glow:rgba(178,58,46,0.12);
    --sync-idle:#B7AF9C;
    --sync-busy:#C98A2E;
    --sync-ok:#3F8F5F;
    --sync-err:#B23A2E;
  }
  html[data-theme="dark"]{
    --bg:#1C1B19;
    --paper:#EAE4D8;
    --muted:#8C8577;
    --hairline:#33312C;
    --field-bg:#171614;
    --hanko:#C24B3E;
    --hanko-text:#FBF2E9;
    --hanko-glow:rgba(194,75,62,0.18);
    --sync-idle:#5B584F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* アプリ全体を「キーボードを除いた実際に見えている高さ」に固定する。
     visualViewportのheight/offsetTopをJSから --app-h / --app-top に反映し、
     ソフトキーボードが出ても隠れる領域には何も置かない構成にする。 */
  #app{
    position:fixed;
    left:0; right:0;
    top:var(--app-top, 0px);
    height:var(--app-h, 100dvh);
    display:flex;
    flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 8px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    overflow:hidden;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex:0 0 auto;
    margin-bottom:6px;
  }
  .icon-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none;
    color:var(--muted);
    opacity:0.7;
    cursor:pointer;
  }
  .icon-btn:active{ opacity:1; }
  .icon-btn svg{ width:19px; height:19px; }
  .brand{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--muted);
    opacity:0.75;
  }

  .screen{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .screen[hidden]{ display:none; }

  /* ---- 開始前画面 ---- */
  #idle{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:22px;
    padding:0 6px;
  }
  #idle .emoji{ font-size:44px; }
  #idle h1{
    font-size:21px;
    font-weight:600;
    letter-spacing:0.04em;
  }
  #idle p{
    font-size:14px;
    line-height:1.85;
    color:var(--muted);
    max-width:320px;
  }
  .big-btn{
    display:block;
    width:100%;
    max-width:340px;
    min-height:68px;
    border:none;
    border-radius:12px;
    background:var(--hanko);
    color:var(--hanko-text);
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.08em;
    cursor:pointer;
    touch-action:manipulation;
    box-shadow:0 4px 14px var(--hanko-glow);
  }
  .big-btn:active{ opacity:0.85; transform:translateY(1px); }
  .big-btn:disabled{ opacity:0.4; }

  /* ---- 録音中画面 ---- */
  #ride{ gap:10px; }

  .ride-controls{ flex:0 0 auto; }
  .ride-meta{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--sync-idle);
    flex:0 0 auto;
  }
  .dot.busy{ background:var(--sync-busy); animation:pulse 1s ease-in-out infinite; }
  .dot.ok{ background:var(--sync-ok); }
  .dot.err{ background:var(--sync-err); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  #syncLabel{ flex:1 1 auto; }
  .text-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.02em;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    padding:4px 0;
  }
  .text-btn:disabled{ opacity:0.35; text-decoration:none; }

  #recDot{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--hanko);
    display:inline-block;
    margin-right:8px;
    animation:recpulse 1.4s ease-in-out infinite;
    vertical-align:middle;
  }
  @keyframes recpulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.45; transform:scale(0.8);} }
  #liveLabel{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.03em;
    margin-top:4px;
  }

  #voiceInput{
    flex:0 0 auto;
    width:100%;
    min-height:84px;
    max-height:150px;
    resize:none;
    background:var(--field-bg);
    border:1.5px solid var(--hairline);
    border-radius:10px;
    padding:12px 14px;
    color:var(--paper);
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    font-size:21px;
    line-height:1.6;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
  }
  #voiceInput:focus{ border-color:var(--hanko); }
  #voiceInput::placeholder{ color:var(--muted); opacity:0.6; }

  .line-actions{
    flex:0 0 auto;
    display:flex;
    justify-content:flex-end;
    gap:18px;
    margin:4px 2px 2px;
  }

  #log{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding-top:8px;
    border-top:1px solid var(--hairline);
    margin-top:6px;
  }
  .log-row{
    display:flex;
    gap:10px;
    padding:9px 2px;
    border-bottom:1px solid var(--hairline);
    font-size:16.5px;
    line-height:1.6;
  }
  .log-row .t{
    flex:0 0 auto;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    padding-top:3px;
    white-space:nowrap;
  }
  .log-row .x{ flex:1 1 auto; word-break:break-word; }
  #log:empty::before{
    content:"ここに話した内容が、時刻つきで積み上がっていきます";
    display:block;
    color:var(--muted);
    font-size:13px;
    padding:14px 2px;
  }

  #toast{
    position:fixed;
    left:0; right:0;
    bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
    pointer-events:none;
    z-index:15;
  }
  #toast .inner{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--hanko-text);
    background:var(--hanko);
    padding:8px 16px;
    border-radius:20px;
    opacity:0;
    transition:opacity .3s ease;
    box-shadow:0 4px 14px var(--hanko-glow);
  }
  #toast .inner.show{ opacity:0.96; }

  .hanko-stamp{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.4) rotate(-8deg);
    width:104px; height:104px;
    border:3px solid var(--hanko);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--hanko);
    background:var(--bg);
    font-family:'Zen Old Mincho', serif;
    font-size:44px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 40px var(--hanko-glow);
    z-index:20;
  }
  .hanko-stamp.stamped{
    opacity:0.94;
    transform:translate(-50%,-50%) scale(1) rotate(-8deg);
  }
  .hanko-stamp.fadeout{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.08) rotate(-8deg);
    transition:opacity .6s ease, transform .6s ease;
  }

  /* ---- 設定モーダル(v2/v3と共通のToken/owner/repo/branch/folderをそのまま共有) ---- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,10,9,0.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:30;
  }
  .overlay.open{ display:flex; }
  .modal{
    width:min(400px, 88vw);
    background:var(--bg);
    border:1px solid var(--hairline);
    border-radius:8px;
    padding:26px 24px 20px;
    max-height:86vh;
    overflow-y:auto;
  }
  .modal h2{ font-size:15px; font-weight:600; margin-bottom:4px; }
  .modal .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:18px;
    line-height:1.6;
  }
  .field{ margin-bottom:13px; }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    background:var(--field-bg);
    border:1px solid var(--hairline);
    border-radius:4px;
    padding:9px 10px;
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    outline:none;
  }
  .field input:focus{ border-color:var(--hanko); }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
  }
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn-primary{ background:var(--hanko); color:var(--hanko-text); border-color:var(--hanko); }
  .btn-ghost{ background:none; color:var(--muted); border-color:var(--hairline); }
</style>
</head>
<body>

  <div id="app">
    <div class="topbar">
      <button class="icon-btn" id="gearBtn" title="接続設定" aria-label="接続設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <span class="brand">輪 · 自転車モード</span>
      <button class="icon-btn" id="themeBtn" title="テーマ切替" aria-label="テーマ切替">
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"></path>
        </svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path>
        </svg>
      </button>
    </div>

    <!-- 開始前画面: 出発前・停車中に1回だけタップする画面 -->
    <div id="idle" class="screen">
      <div class="emoji">🚲</div>
      <h1>自転車メモ</h1>
      <p>タップしてキーボードを表示させたら、あとはキーボードのマイクボタンで話しかけるだけ。<br>認識された内容は自動で1行ずつ積み上がって、少し話し終える度に自動で保存されます。</p>
      <button class="big-btn" id="startBtn">はじめる</button>
    </div>

    <!-- 録音中画面: 走行中はここだけを見ればよい構成(画面上部のみで完結) -->
    <div id="ride" class="screen" hidden>
      <div class="ride-controls">
        <button class="big-btn" id="finishBtn">終了して保存</button>
        <div class="ride-meta">
          <span class="dot" id="syncDot"></span>
          <span id="syncLabel">待機中</span>
          <button class="text-btn" id="undoBtn" disabled>直前を取消</button>
        </div>
      </div>

      <div id="liveLabel"><span id="recDot"></span>話しかけると、ここに表示されます</div>
      <textarea id="voiceInput" rows="2" placeholder="キーボードのマイクで話す…"
        autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></textarea>
      <div class="line-actions">
        <button class="text-btn" id="commitBtn">▶ 今すぐこの行を確定</button>
      </div>

      <div id="log" aria-live="polite"></div>
    </div>
  </div>

  <div id="toast"><div class="inner" id="toastInner"></div></div>
  <div class="hanko-stamp" id="stamp">済</div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>接続設定</h2>
      <div class="sub">GitHub Personal Access Token が必要です（対象リポジトリの Contents: Read and write）。<br>この設定は禅ノートv1〜v3と共通です。</div>

      <div class="field">
        <label>Token</label>
        <input type="password" id="f-token" placeholder="github_pat_xxxxxxxxxxxx" autocomplete="off">
      </div>
      <div class="field">
        <label>リポジトリ所有者</label>
        <input type="text" id="f-owner" placeholder="例: plzsayyes3">
      </div>
      <div class="field">
        <label>リポジトリ名</label>
        <input type="text" id="f-repo" placeholder="例: mynotebook">
      </div>
      <div class="field">
        <label>ブランチ</label>
        <input type="text" id="f-branch" placeholder="main">
      </div>
      <div class="field">
        <label>保存フォルダ</label>
        <input type="text" id="f-folder" placeholder="00_inbox">
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="clearBtn">接続を解除</button>
        <button class="btn btn-primary" id="saveSettingsBtn">保存して閉じる</button>
      </div>
    </div>
  </div>

<script>
"use strict";

const DEFAULTS = {
  owner: "plzsayyes3",
  repo: "mynotebook",
  branch: "main",
  folder: "00_inbox",
};

const SILENCE_MS = 1600;   // これだけ無音(=inputイベントが来ない)が続いたら1行として確定する
const SYNC_DEBOUNCE_MS = 3500; // 行確定からこれだけ経ったらGitHubへまとめて送る(連続する発話を1回にまとめる)

const el = (id) => document.getElementById(id);
const app = el('app');
const idleScreen = el('idle');
const rideScreen = el('ride');
const startBtn = el('startBtn');
const finishBtn = el('finishBtn');
const undoBtn = el('undoBtn');
const commitBtn = el('commitBtn');
const voiceInput = el('voiceInput');
const logEl = el('log');
const syncDot = el('syncDot');
const syncLabel = el('syncLabel');
const gearBtn = el('gearBtn');
const themeBtn = el('themeBtn');
const overlay = el('overlay');
const stamp = el('stamp');
const toast = el('toast');
const toastInner = el('toastInner');

const fToken = el('f-token');
const fOwner = el('f-owner');
const fRepo = el('f-repo');
const fBranch = el('f-branch');
const fFolder = el('f-folder');

let settings = null;
let lines = [];              // {t:'HH:MM', text:'...'}
let fileMeta = null;         // {path, sha, dateLabel, startedAt}
let isComposing = false;
let silenceTimer = null;
let syncTimer = null;
let syncInFlight = false;
let syncPendingAgain = false;

// ---------------- ユーティリティ ----------------
function pad(n){ return String(n).padStart(2,'0'); }
function nowClock(){ const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function timestampName(){
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
function dateLabel(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}〜`;
}
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) =>
    String.fromCharCode(parseInt(p1, 16))
  ));
}
function vibrate(ms){
  // iOS SafariはVibration API未対応のため、対応環境でのみ効く(未対応時は何もしない)
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}
let toastTimer = null;
function showToast(msg){
  toastInner.textContent = msg;
  toastInner.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastInner.classList.remove('show'), 2600);
}
function playStamp(){
  stamp.classList.remove('fadeout');
  stamp.classList.add('stamped');
  setTimeout(()=>{
    stamp.classList.add('fadeout');
    stamp.classList.remove('stamped');
  }, 900);
}

// ---------------- テーマ ----------------
function applyTheme(theme){
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme','dark');
    el('themeIconSun').style.display = 'none';
    el('themeIconMoon').style.display = '';
  }else{
    document.documentElement.removeAttribute('data-theme');
    el('themeIconSun').style.display = '';
    el('themeIconMoon').style.display = 'none';
  }
}
function loadTheme(){
  let t = 'light';
  try{ t = localStorage.getItem('bike:theme') || 'light'; }catch(e){}
  applyTheme(t);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('bike:theme', next); }catch(e){}
}

// ---------------- 接続設定(v1〜v3と同じキーで共有) ----------------
function loadSettings(){
  try{
    const raw = localStorage.getItem('zen:settings:github');
    if(raw) settings = JSON.parse(raw);
  }catch(e){}
}
function saveSettings(){
  const obj = {
    token: fToken.value.trim(),
    owner: fOwner.value.trim() || DEFAULTS.owner,
    repo: fRepo.value.trim() || DEFAULTS.repo,
    branch: fBranch.value.trim() || DEFAULTS.branch,
    folder: (fFolder.value.trim() || DEFAULTS.folder).replace(/^\/+|\/+$/g,'')
  };
  try{
    localStorage.setItem('zen:settings:github', JSON.stringify(obj));
    settings = obj;
    overlay.classList.remove('open');
    if(fileMeta) scheduleSync();
  }catch(e){
    showToast('設定の保存に失敗しました');
  }
}
function clearSettings(){
  try{ localStorage.removeItem('zen:settings:github'); }catch(e){}
  settings = null;
  fToken.value=''; fOwner.value=''; fRepo.value=''; fBranch.value=''; fFolder.value='';
  overlay.classList.remove('open');
}
function openSettings(){
  const s = settings || {};
  fToken.value = s.token || '';
  fOwner.value = s.owner || DEFAULTS.owner;
  fRepo.value = s.repo || DEFAULTS.repo;
  fBranch.value = s.branch || DEFAULTS.branch;
  fFolder.value = s.folder || DEFAULTS.folder;
  overlay.classList.add('open');
}

// ---------------- 下書き(ローカル保存。GitHubへ送れなくても消えない) ----------------
function persistDraft(){
  try{
    localStorage.setItem('bike:draft:lines', JSON.stringify(lines));
    localStorage.setItem('bike:draft:meta', JSON.stringify(fileMeta));
  }catch(e){ /* 保存できなくてもアプリ内の状態は保持したまま続行 */ }
}
function clearDraft(){
  try{
    localStorage.removeItem('bike:draft:lines');
    localStorage.removeItem('bike:draft:meta');
  }catch(e){}
}
function loadDraft(){
  try{
    const rawLines = localStorage.getItem('bike:draft:lines');
    const rawMeta = localStorage.getItem('bike:draft:meta');
    if(rawLines && rawMeta){
      const parsedLines = JSON.parse(rawLines);
      const parsedMeta = JSON.parse(rawMeta);
      if(Array.isArray(parsedLines) && parsedLines.length > 0 && parsedMeta && parsedMeta.path){
        return { lines: parsedLines, meta: parsedMeta };
      }
    }
  }catch(e){}
  return null;
}

// ---------------- ログ表示 ----------------
function renderLogAppend(line){
  const row = document.createElement('div');
  row.className = 'log-row';
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = line.t;
  const x = document.createElement('span');
  x.className = 'x';
  x.textContent = line.text;
  row.appendChild(t);
  row.appendChild(x);
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  undoBtn.disabled = lines.length === 0;
}
function renderLogAll(){
  logEl.innerHTML = '';
  lines.forEach(renderLogAppend);
}

// ---------------- 行の確定・取消 ----------------
function ensureFileMeta(){
  if(fileMeta) return;
  fileMeta = {
    path: `${(settings && settings.folder) || DEFAULTS.folder}/${timestampName()}-bike.md`,
    sha: null,
    dateLabel: dateLabel(),
    startedAt: Date.now()
  };
}
function commitCurrentLine(){
  const text = voiceInput.value.trim();
  clearTimeout(silenceTimer);
  if(!text) return;
  ensureFileMeta();
  lines.push({ t: nowClock(), text });
  voiceInput.value = '';
  renderLogAppend(lines[lines.length - 1]);
  persistDraft();
  vibrate(15);
  scheduleSync();
}
function scheduleSilenceCheck(){
  clearTimeout(silenceTimer);
  if(isComposing) return;
  if(!voiceInput.value.trim()) return;
  silenceTimer = setTimeout(commitCurrentLine, SILENCE_MS);
}
function undoLast(){
  if(lines.length === 0) return;
  lines.pop();
  renderLogAll();
  persistDraft();
  vibrate(10);
  scheduleSync();
}

// ---------------- GitHubへの保存 ----------------
function buildMarkdown(){
  const header = `# 🚲 自転車メモ ${fileMeta.dateLabel}\n\n`;
  const body = lines.map(l => `- ${l.t} ${l.text}`).join('\n');
  return header + body + '\n';
}
function setSyncState(state, label){
  syncDot.className = 'dot' + (state === 'idle' ? '' : ' ' + state);
  syncLabel.textContent = label;
}
function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, SYNC_DEBOUNCE_MS);
  setSyncState('busy', '少し待って保存します…');
}
async function ghFetch(path, opts){
  return fetch(`https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`, opts);
}
async function syncNow(){
  clearTimeout(syncTimer);
  if(!fileMeta || lines.length === 0) { setSyncState('idle', '待機中'); return; }
  if(!settings || !settings.token || !settings.owner || !settings.repo){
    // 走行中に設定モーダルを開くと危険なので、ここではエラー表示のみ。ローカルの下書きは保持し続ける。
    setSyncState('err', '未送信・接続設定が必要です');
    return;
  }
  if(syncInFlight){ syncPendingAgain = true; return; }
  syncInFlight = true;
  setSyncState('busy', '保存中…');

  const text = buildMarkdown();
  const headers = {
    'Authorization': `Bearer ${settings.token}`,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
  const body = {
    message: `自転車メモ: ${fileMeta.dateLabel}`,
    content: b64EncodeUnicode(text),
    branch: settings.branch || 'main'
  };
  if(fileMeta.sha) body.sha = fileMeta.sha;

  try{
    let res = await ghFetch(fileMeta.path, { method:'PUT', headers, body: JSON.stringify(body) });

    if(res.status === 401){
      await new Promise(r => setTimeout(r, 1000));
      res = await ghFetch(fileMeta.path, { method:'PUT', headers, body: JSON.stringify(body) });
    }

    if(res.status === 409 || res.status === 422){
      // sha不一致(別端末で編集された等)。最新のshaを取り直して1回だけ再試行する
      const shaRes = await ghFetch(`${fileMeta.path}?ref=${settings.branch || 'main'}`, { headers });
      if(shaRes.ok){
        const d = await shaRes.json();
        fileMeta.sha = d.sha;
        body.sha = d.sha;
        res = await ghFetch(fileMeta.path, { method:'PUT', headers, body: JSON.stringify(body) });
      }
    }

    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      throw new Error(errData.message || `GitHub API error (${res.status})`);
    }

    const data = await res.json();
    fileMeta.sha = data.content.sha;
    persistDraft();
    setSyncState('ok', `保存済み・全${lines.length}件`);
  }catch(e){
    setSyncState('err', '未送信・電波の良い場所で再試行します');
  }finally{
    syncInFlight = false;
    if(syncPendingAgain){
      syncPendingAgain = false;
      scheduleSync();
    }
  }
}

async function finishRide(){
  commitCurrentLine();
  if(lines.length === 0){
    resetToIdle();
    return;
  }
  finishBtn.disabled = true;
  finishBtn.textContent = '保存しています…';
  await syncNow();
  finishBtn.disabled = false;
  finishBtn.textContent = '終了して保存';

  if(syncDot.classList.contains('ok')){
    playStamp();
    showToast(`${lines.length}件を保存しました`);
    clearDraft();
    resetToIdle();
  }else{
    showToast('保存できていません。下書きは端末に残っています');
    // 送れなかった場合は録音画面に留まり、電波が戻り次第 online イベントで自動再送する
  }
}

function resetToIdle(){
  lines = [];
  fileMeta = null;
  logEl.innerHTML = '';
  voiceInput.value = '';
  undoBtn.disabled = true;
  setSyncState('idle', '待機中');
  rideScreen.hidden = true;
  idleScreen.hidden = false;
}

function enterRide(){
  idleScreen.hidden = true;
  rideScreen.hidden = false;
  requestAnimationFrame(()=> voiceInput.focus());
}

// ---------------- レイアウト: キーボードを除いた可視領域に合わせる ----------------
function applyViewportGeometry(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  document.documentElement.style.setProperty('--app-top', top + 'px');
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------------- イベント ----------------
startBtn.addEventListener('click', enterRide);
finishBtn.addEventListener('click', finishRide);
undoBtn.addEventListener('click', undoLast);
commitBtn.addEventListener('click', commitCurrentLine);

voiceInput.addEventListener('compositionstart', ()=>{ isComposing = true; });
voiceInput.addEventListener('compositionend', ()=>{ isComposing = false; scheduleSilenceCheck(); });
voiceInput.addEventListener('input', scheduleSilenceCheck);

gearBtn.addEventListener('click', openSettings);
themeBtn.addEventListener('click', toggleTheme);
document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
document.getElementById('clearBtn').addEventListener('click', clearSettings);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });

window.addEventListener('resize', applyViewportGeometry);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', applyViewportGeometry);
  window.visualViewport.addEventListener('scroll', applyViewportGeometry);
}
window.addEventListener('online', ()=>{ if(fileMeta && lines.length > 0) syncNow(); });

// ---------------- 初期化 ----------------
(function init(){
  loadTheme();
  loadSettings();
  applyViewportGeometry();

  const draft = loadDraft();
  if(draft){
    lines = draft.lines;
    fileMeta = draft.meta;
    renderLogAll();
    rideScreen.hidden = false;
    idleScreen.hidden = true;
    setSyncState('err', `前回の続き・全${lines.length}件・未送信の可能性`);
    showToast('前回の続きを再開しました');
    syncNow();
  }
})();
</script>
</body>
