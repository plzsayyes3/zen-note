<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f1f0eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>禅ノート v9 — 大文字ジャーナル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f0eb;
  --ink:#292924;
  --muted:#8b8880;
  --accent:#b8665d;
  --pad-top:max(18px,calc(env(safe-area-inset-top) + 12px));
  --pad-bottom:max(20px,calc(env(safe-area-inset-bottom) + 14px));
  --pad-left:max(28px,calc(env(safe-area-inset-left) + 18px));
  --pad-right:max(28px,calc(env(safe-area-inset-right) + 18px));
  --editor-size:clamp(32px,3.8vw,38px);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background-image:radial-gradient(circle at 1px 1px,rgba(30,30,26,.025) 1px,transparent 0);
  background-size:24px 24px;
}
.zen{
  width:100%;height:100dvh;min-height:100vh;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
}
.top{
  min-height:28px;display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;pointer-events:none;user-select:none;
}
.mode-row{display:flex;align-items:center;gap:10px}
.gear{pointer-events:auto;border:0;padding:0;background:transparent;color:var(--muted);font:600 13px/1 ui-monospace,monospace;opacity:.42;cursor:pointer}
.gear:hover,.gear:focus-visible{opacity:.9;outline:none}
.mode{
  color:var(--muted);
  font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.15em;opacity:.68;
}
.clock{
  color:var(--muted);
  font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.04em;opacity:.72;
}
.editor-wrap{min-height:0;display:flex;justify-content:center;padding:18px 0 10px}
textarea{
  width:min(100%,48em);height:100%;min-height:0;margin:0;padding:0;border:0;outline:0;
  resize:none;background:transparent;color:var(--ink);
  font-family:"Hina Mincho","Yu Mincho","YuMincho",serif;
  font-size:var(--editor-size);font-weight:400;line-height:1.85;letter-spacing:.015em;
  caret-color:var(--accent);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  overscroll-behavior:contain;scrollbar-width:none;
}
textarea::-webkit-scrollbar{display:none}
textarea::placeholder{color:#aaa79f;opacity:.62}
.bottom{
  min-height:24px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:18px;color:var(--muted);user-select:none;
}
.save-state,.count{
  font:600 9px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em;opacity:.60;
}
.save-state{display:flex;align-items:center;gap:7px}
.dot{
  width:6px;height:6px;border-radius:50%;background:#b3b0aa;
  transition:background .2s,opacity .2s;
}
.save-state.saving .dot{background:var(--accent)}
.save-state.saved .dot{background:#6d786e}
.save-state.sent .dot{background:#6d786e}
.overlay{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:rgba(20,20,18,.38);backdrop-filter:blur(5px)}
.overlay.open{display:grid}
.panel{width:min(460px,100%);max-height:min(620px,90dvh);overflow:auto;border-radius:14px;padding:20px;background:#f8f7f2;color:#292924;box-shadow:0 24px 70px rgba(0,0,0,.2)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.panel-title{font:700 11px/1 ui-monospace,monospace;letter-spacing:.12em}
.close,.settings-save{border:0;border-radius:7px;padding:9px 11px;background:#e9e7e0;color:#292924;font:700 9px/1 ui-monospace,monospace;cursor:pointer}
.settings-save{background:#292924;color:#faf9f5}
.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#77736c;font:700 8px/1 ui-monospace,monospace;letter-spacing:.08em}
.field input{width:100%;height:38px;border:1px solid #d7d3ca;border-radius:7px;padding:0 10px;background:#fff;color:#292924;font:13px/1 ui-monospace,monospace;outline:none}
.panel-foot{display:flex;justify-content:flex-end;margin-top:18px}
.panel-note{margin:0 0 14px;color:#77736c;font-size:11px;line-height:1.6}
.toast{position:fixed;z-index:40;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));transform:translate(-50%,12px);max-width:min(520px,calc(100vw - 40px));padding:9px 12px;border-radius:999px;background:rgba(41,41,36,.92);color:#faf9f5;font:700 10px/1.3 ui-monospace,monospace;opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait){
  :root{
    --editor-size:clamp(30px,7vw,36px);
    --pad-left:max(24px,calc(env(safe-area-inset-left) + 16px));
    --pad-right:max(24px,calc(env(safe-area-inset-right) + 16px));
  }
  .editor-wrap{padding-top:24px}
  textarea{line-height:1.9}
}
@media (orientation:landscape) and (max-height:520px){
  :root{
    --editor-size:clamp(34px,4vw,38px);
    --pad-top:max(14px,calc(env(safe-area-inset-top) + 10px));
    --pad-bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));
    --pad-left:max(34px,calc(env(safe-area-inset-left) + 20px));
    --pad-right:max(34px,calc(env(safe-area-inset-right) + 20px));
  }
  .top{min-height:20px}
  .editor-wrap{padding:10px 0 6px}
  .bottom{min-height:18px}
}
@media (orientation:landscape) and (max-height:400px){
  :root{--editor-size:34px}
  .mode{opacity:.42}
  .bottom{opacity:.72}
}
@media (prefers-color-scheme:dark){
  body.auto-dark{
    --bg:#111310;--ink:#ecebe5;--muted:#777b74;--accent:#d9897f;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.022) 1px,transparent 0);
  }
  body.auto-dark textarea::placeholder{color:#777b74}
}
</style>
</head>
<body class="auto-dark">
<main class="zen">
  <header class="top">
    <div class="mode-row"><div class="mode">ZEN / LARGE WRITE</div><button class="gear" id="gear" type="button" aria-label="GitHub接続設定">⚙</button></div>
    <time class="clock" id="clock">--:--</time>
  </header>
  <section class="editor-wrap">
    <textarea id="editor" autofocus spellcheck="true" autocapitalize="sentences" autocomplete="off"
      placeholder="思いついたまま、ここに置く……" aria-label="ZEN入力欄"></textarea>
  </section>
  <footer class="bottom">
    <div class="save-state saved" id="saveState"><span class="dot"></span><span id="saveLabel">READY · ⌘↵ SEND</span></div>
    <div class="count"><span id="charCount">0</span> chars</div>
  </footer>
</main>
<div class="overlay" id="settingsOverlay" aria-hidden="true">
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="panel-head"><div class="panel-title" id="settingsTitle">GITHUB CONNECTION</div><button class="close" id="settingsClose" type="button">CLOSE</button></div>
    <p class="panel-note">他の禅ノートと同じ接続設定を共有します。送信先の既定値は mynotebook / 00_inbox です。</p>
    <div class="field"><label for="f-token">TOKEN</label><input id="f-token" type="password" autocomplete="off" placeholder="github_pat_…"></div>
    <div class="field"><label for="f-owner">OWNER</label><input id="f-owner" type="text"></div>
    <div class="field"><label for="f-repo">REPOSITORY</label><input id="f-repo" type="text"></div>
    <div class="field"><label for="f-branch">BRANCH</label><input id="f-branch" type="text"></div>
    <div class="field"><label for="f-folder">FOLDER</label><input id="f-folder" type="text"></div>
    <div class="panel-foot"><button class="settings-save" id="settingsSave" type="button">SAVE</button></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const editor = document.getElementById('editor');
  const clock = document.getElementById('clock');
  const charCount = document.getElementById('charCount');
  const saveState = document.getElementById('saveState');
  const saveLabel = document.getElementById('saveLabel');
  const STORAGE_KEY = 'zen-note-v9-draft';
  const SETTINGS_KEY = 'zen:settings:github';
  const DEFAULTS = {owner:'plzsayyes3',repo:'mynotebook',branch:'main',folder:'00_inbox'};
  const SAVE_DELAY = 20000;
  const gear = document.getElementById('gear');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsClose = document.getElementById('settingsClose');
  const settingsSave = document.getElementById('settingsSave');
  const toast = document.getElementById('toast');
  let saveTimer = null;
  let sending = false;
  let settings = null;

  const updateClock = () => {
    const now = new Date();
    clock.textContent = now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  };
  const setState = (state,label) => {
    saveState.classList.remove('saving','saved','sent');
    saveState.classList.add(state);
    saveLabel.textContent = label;
  };
  const save = () => {
    localStorage.setItem(STORAGE_KEY,editor.value);
    setState('saved','SAVED');
  };
  const scheduleSave = () => {
    clearTimeout(saveTimer);
    setState('saving','WRITING');
    saveTimer = setTimeout(save,SAVE_DELAY);
  };
  const updateCount = () => {
    charCount.textContent = editor.value.length.toLocaleString('ja-JP');
  };

  const showToast = (message) => {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'),3600);
  };
  const pad = n => String(n).padStart(2,'0');
  const pad3 = n => String(n).padStart(3,'0');
  const timestampName = () => {
    const d = new Date();
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${pad3(d.getMilliseconds())}`;
  };
  const b64EncodeUnicode = str => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(_,p)=>String.fromCharCode(parseInt(p,16))));
  const loadSettings = () => {
    try{settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null')}catch(e){settings=null}
  };
  const openSettings = () => {
    const s=settings||{};
    document.getElementById('f-token').value=s.token||'';
    document.getElementById('f-owner').value=s.owner||DEFAULTS.owner;
    document.getElementById('f-repo').value=s.repo||DEFAULTS.repo;
    document.getElementById('f-branch').value=s.branch||DEFAULTS.branch;
    document.getElementById('f-folder').value=s.folder||DEFAULTS.folder;
    settingsOverlay.classList.add('open');
    settingsOverlay.setAttribute('aria-hidden','false');
  };
  const closeSettings = () => {
    settingsOverlay.classList.remove('open');
    settingsOverlay.setAttribute('aria-hidden','true');
    requestAnimationFrame(()=>editor.focus());
  };
  const saveSettingsNow = () => {
    settings={
      token:document.getElementById('f-token').value.trim(),
      owner:document.getElementById('f-owner').value.trim()||DEFAULTS.owner,
      repo:document.getElementById('f-repo').value.trim()||DEFAULTS.repo,
      branch:document.getElementById('f-branch').value.trim()||DEFAULTS.branch,
      folder:(document.getElementById('f-folder').value.trim()||DEFAULTS.folder).replace(/^\/+|\/+$/g,'')
    };
    try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}
    closeSettings();
    setState('saved','READY · ⌘↵ SEND');
  };
  const send = async () => {
    if(sending)return;
    const body=editor.value.trim();
    if(!body){showToast('送信する内容がありません');return}
    loadSettings();
    if(!settings||!settings.token||!settings.owner||!settings.repo){
      save();
      openSettings();
      showToast('先にGitHub接続設定を保存してください');
      return;
    }
    sending=true;
    clearTimeout(saveTimer);
    save();
    setState('saving','SENDING…');
    const name=timestampName();
    const folder=(settings.folder||DEFAULTS.folder).replace(/^\/+|\/+$/g,'');
    const path=`${folder}/${name}.md`;
    const api=`https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`;
    const options={
      method:'PUT',
      headers:{
        'Authorization':`Bearer ${settings.token}`,
        'Accept':'application/vnd.github+json',
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        message:`Zen v9: ${body.replace(/\s+/g,' ').slice(0,40)}`,
        content:b64EncodeUnicode(body+'\n'),
        branch:settings.branch||DEFAULTS.branch
      })
    };
    try{
      let res=await fetch(api,options);
      if(res.status===401){
        await new Promise(r=>setTimeout(r,900));
        res=await fetch(api,options);
      }
      if(!res.ok){
        const data=await res.json().catch(()=>({}));
        throw new Error(data.message||`GitHub API error (${res.status})`);
      }
      try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
      editor.value='';
      updateCount();
      setState('sent','SENT');
      showToast('00_inboxへ送信しました');
      setTimeout(()=>setState('saved','READY · ⌘↵ SEND'),1400);
    }catch(e){
      save();
      setState('saved','SEND FAILED · DRAFT SAVED');
      showToast('送信に失敗しました: '+e.message);
    }finally{
      sending=false;
      requestAnimationFrame(()=>editor.focus());
    }
  };

  loadSettings();
  const restored = localStorage.getItem(STORAGE_KEY);
  if(restored){
    editor.value = restored;
    setState('saved','RESTORED');
  }

  editor.addEventListener('input',() => {
    updateCount();
    scheduleSave();
  });
  editor.addEventListener('keydown',event => {
    if(event.isComposing)return;
    if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){
      event.preventDefault();
      send();
    }
  });
  gear.addEventListener('click',openSettings);
  settingsClose.addEventListener('click',closeSettings);
  settingsSave.addEventListener('click',saveSettingsNow);
  settingsOverlay.addEventListener('click',event=>{if(event.target===settingsOverlay)closeSettings()});
  document.addEventListener('visibilitychange',() => {
    if(document.hidden && editor.value) save();
  });
  window.addEventListener('pagehide',() => {
    if(editor.value) save();
  });

  updateClock();
  updateCount();
  setInterval(updateClock,1000);
  requestAnimationFrame(() => editor.focus());
})();
</script>
</body>
</html>
