<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f1f0eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>禅ノート v10 — Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f0eb;
  --ink:#292924;
  --muted:#8b8880;
  --accent:#b8665d;
  --pad-top:max(18px,calc(env(safe-area-inset-top) + 12px));
  --pad-bottom:max(20px,calc(env(safe-area-inset-bottom) + 14px));
  --pad-left:max(28px,calc(env(safe-area-inset-left) + 18px));
  --pad-right:max(28px,calc(env(safe-area-inset-right) + 18px));
  --editor-size:clamp(32px,3.8vw,38px);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background-image:radial-gradient(circle at 1px 1px,rgba(30,30,26,.025) 1px,transparent 0);
  background-size:24px 24px;
}
.pomo-strip{
  position:fixed;z-index:24;left:0;right:0;top:0;height:4px;
  background:rgba(139,136,128,.22);
  transition:background .22s,box-shadow .22s;
  pointer-events:none;
}
.pomo-strip.rest-ready{background:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.pomo-strip.resting{background:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 42%,transparent)}
.zen{
  width:100%;height:100dvh;min-height:100vh;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
}
.top{
  min-height:28px;display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;pointer-events:none;user-select:none;
}
.mode-row{display:flex;align-items:center;gap:10px;pointer-events:auto}
.gear{pointer-events:auto;border:0;padding:0;background:transparent;color:var(--muted);font:600 13px/1 ui-monospace,monospace;opacity:.42;cursor:pointer}
.gear:hover,.gear:focus-visible{opacity:.9;outline:none}
.mode{
  color:var(--muted);
  font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.15em;opacity:.68;
}
.top-right{display:flex;align-items:center;gap:12px;pointer-events:auto}
.pomo{
  border:0;padding:0;background:transparent;color:var(--muted);
  font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.06em;opacity:.58;cursor:pointer;
}
.pomo.running{opacity:.82}
.pomo.breaking{color:var(--accent);opacity:.9}
.clock{
  color:var(--muted);
  font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.04em;opacity:.72;
}
.editor-wrap{min-height:0;display:flex;justify-content:center;padding:18px 0 10px}
textarea{
  width:min(100%,48em);height:100%;min-height:0;margin:0;padding:0;border:0;outline:0;
  resize:none;background:transparent;color:var(--ink);
  font-family:"Hina Mincho","Yu Mincho","YuMincho",serif;
  font-size:var(--editor-size);font-weight:400;line-height:1.85;letter-spacing:.015em;
  caret-color:var(--accent);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  overscroll-behavior:contain;scrollbar-width:none;
}
textarea::-webkit-scrollbar{display:none}
textarea::placeholder{color:#aaa79f;opacity:.62}
.bottom{
  min-height:24px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:18px;color:var(--muted);user-select:none;
}
.save-state,.count{
  font:600 9px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em;opacity:.60;
}
.save-actions{display:flex;align-items:center;gap:12px;min-width:0}
.save-state{display:flex;align-items:center;gap:7px;min-width:0}
.send-btn{border:0;border-radius:8px;padding:9px 13px;background:var(--accent);color:white;font:700 11px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;opacity:1;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.send-btn:hover,.send-btn:focus-visible{filter:brightness(.93);outline:2px solid var(--ink);outline-offset:2px}
.send-btn:disabled{opacity:.44;cursor:wait}
.dot{
  width:6px;height:6px;border-radius:50%;background:#b3b0aa;
  transition:background .2s,opacity .2s;
}
.save-state.saving .dot{background:var(--accent)}
.save-state.saved .dot{background:#6d786e}
.save-state.sent .dot{background:#6d786e}
.overlay{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:rgba(20,20,18,.38);backdrop-filter:blur(5px)}
.overlay.open{display:grid}
.panel{width:min(460px,100%);max-height:min(620px,90dvh);overflow:auto;border-radius:14px;padding:20px;background:#f8f7f2;color:#292924;box-shadow:0 24px 70px rgba(0,0,0,.2)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.panel-title{font:700 11px/1 ui-monospace,monospace;letter-spacing:.12em}
.close,.settings-save{border:0;border-radius:7px;padding:9px 11px;background:#e9e7e0;color:#292924;font:700 9px/1 ui-monospace,monospace;cursor:pointer}
.settings-save{background:#292924;color:#faf9f5}
.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#77736c;font:700 8px/1 ui-monospace,monospace;letter-spacing:.08em}
.field input{width:100%;height:38px;border:1px solid #d7d3ca;border-radius:7px;padding:0 10px;background:#fff;color:#292924;font:13px/1 ui-monospace,monospace;outline:none}
.panel-foot{display:flex;justify-content:flex-end;margin-top:18px}
.panel-note{margin:0 0 14px;color:#77736c;font-size:11px;line-height:1.6}
.toast{position:fixed;z-index:40;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));transform:translate(-50%,12px);max-width:min(520px,calc(100vw - 40px));padding:9px 12px;border-radius:999px;background:rgba(41,41,36,.92);color:#faf9f5;font:700 10px/1.3 ui-monospace,monospace;opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait){
  :root{
    --editor-size:clamp(30px,7vw,36px);
    --pad-left:max(24px,calc(env(safe-area-inset-left) + 16px));
    --pad-right:max(24px,calc(env(safe-area-inset-right) + 16px));
  }
  .editor-wrap{padding-top:24px}
  textarea{line-height:1.9}
}
@media (orientation:landscape) and (max-height:520px){
  :root{
    --editor-size:clamp(34px,4vw,38px);
    --pad-top:max(14px,calc(env(safe-area-inset-top) + 10px));
    --pad-bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));
    --pad-left:max(34px,calc(env(safe-area-inset-left) + 20px));
    --pad-right:max(34px,calc(env(safe-area-inset-right) + 20px));
  }
  .top{min-height:20px}
  .editor-wrap{padding:10px 0 6px}
  .bottom{min-height:18px}
}
@media (orientation:landscape) and (max-height:400px){
  :root{--editor-size:34px}
  .mode{opacity:.42}
  .bottom{opacity:.72}
}
@media (prefers-color-scheme:dark){
  body.auto-dark{
    --bg:#111310;--ink:#ecebe5;--muted:#777b74;--accent:#d9897f;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.022) 1px,transparent 0);
  }
  body.auto-dark textarea::placeholder{color:#777b74}
}
</style>
</head>
<body class="auto-dark">
<div class="pomo-strip" id="pomoStrip" aria-hidden="true"></div>
<main class="zen">
  <header class="top">
    <div class="mode-row"><div class="mode">ZEN / V10 · KANA</div><button class="send-btn send-top" id="sendButton" type="button" aria-label="Geminiで整形してmynotebookに送信" title="Ctrl / ⌘ + Enter" aria-keyshortcuts="Control+Enter Meta+Enter">SEND ↗</button><button class="gear" id="gear" type="button" aria-label="GitHub・Gemini接続設定">⚙</button></div>
    <div class="top-right"><button class="pomo" id="pomoButton" type="button" aria-label="ポモドーロタイマー">FOCUS 05:00</button><time class="clock" id="clock">--:--</time></div>
  </header>
  <section class="editor-wrap">
    <textarea id="editor" autofocus lang="en" inputmode="text" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"
      placeholder="そのまま打つ……" aria-label="ZEN入力欄"></textarea>
  </section>
  <footer class="bottom">
    <div class="save-state saved" id="saveState"><span class="dot"></span><span id="saveLabel">KANA · Ctrl/⌘↵ SEND</span></div>
    <div class="count"><span id="charCount">0</span> chars</div>
  </footer>
</main>
<div class="overlay" id="settingsOverlay" aria-hidden="true">
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="panel-head"><div class="panel-title" id="settingsTitle">GITHUB CONNECTION</div><button class="close" id="settingsClose" type="button">CLOSE</button></div>
    <p class="panel-note">他の禅ノートと同じ接続設定を共有します。送信先の既定値は mynotebook / 00_inbox です。</p>
    <div class="field"><label for="f-token">TOKEN</label><input id="f-token" type="password" autocomplete="off" placeholder="github_pat_…"></div>
    <div class="field"><label for="f-owner">OWNER</label><input id="f-owner" type="text"></div>
    <div class="field"><label for="f-repo">REPOSITORY</label><input id="f-repo" type="text"></div>
    <div class="field"><label for="f-branch">BRANCH</label><input id="f-branch" type="text"></div>
    <div class="field"><label for="f-folder">FOLDER</label><input id="f-folder" type="text"></div><div class="field"><label for="f-gemini-key">GEMINI API KEY · SEND</label><input id="f-gemini-key" type="password" autocomplete="off" placeholder="AIza…"></div><div class="field"><label for="f-gemini-model">MODEL</label><input id="f-gemini-model" type="text" placeholder="gemini-3.6-flash"></div><p class="panel-note">v3 / v6 で保存済みのGemini API設定を自動で流用します。入力中はローマ字→ひらがなのみ。送信時にGeminiで表記を整えてからGitHubへ保存します。Geminiの変換失敗時は送信せず下書きを残します。</p>
    <div class="panel-foot"><button class="settings-save" id="settingsSave" type="button">SAVE</button></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const editor = document.getElementById('editor');
  const clock = document.getElementById('clock');
  const charCount = document.getElementById('charCount');
  const saveState = document.getElementById('saveState');
  const saveLabel = document.getElementById('saveLabel');
  const sendButton = document.getElementById('sendButton');
  const STORAGE_KEY = 'zen-note-v10-draft';
  const SETTINGS_KEY = 'zen:settings:github';
  const GEMINI_SETTINGS_KEY = 'zen:settings:gemini';
  const DEFAULTS = {owner:'plzsayyes3',repo:'mynotebook',branch:'main',folder:'00_inbox',geminiModel:'gemini-3.6-flash'};
  const SAVE_DELAY = 20000;
  const POMO_KEY = 'zen-note-v10-pomodoro';
  const FOCUS_MS = 5 * 60 * 1000;
  const BREAK_MS = 1 * 60 * 1000;
  const STOP_DELAY_MS = 1500;
  const gear = document.getElementById('gear');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsClose = document.getElementById('settingsClose');
  const settingsSave = document.getElementById('settingsSave');
  const toast = document.getElementById('toast');
  const pomoButton = document.getElementById('pomoButton');
  const pomoStrip = document.getElementById('pomoStrip');
  let saveTimer = null;
  let stopTimer = null;
  let lastInputAt = 0;
  let isComposing = false;
  let sending = false;
  let settings = null;
  let pomo = {phase:'focus',running:false,endAt:null,remainingMs:FOCUS_MS};

  const updateClock = () => {
    const now = new Date();
    clock.textContent = now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  };
  const setState = (state,label) => {
    saveState.classList.remove('saving','saved','sent');
    saveState.classList.add(state);
    saveLabel.textContent = label;
  };
  const save = () => {
    localStorage.setItem(STORAGE_KEY,editor.value);
    setState('saved','SAVED');
  };
  const scheduleSave = () => {
    clearTimeout(saveTimer);
    setState('saving','WRITING');
    saveTimer = setTimeout(save,SAVE_DELAY);
  };
  const updateCount = () => {
    charCount.textContent = editor.value.length.toLocaleString('ja-JP');
  };

  const formatTimer = ms => {
    const total = Math.max(0,Math.ceil(ms/1000));
    const min = Math.floor(total/60);
    const sec = total%60;
    return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  };
  const savePomo = () => {
    try{localStorage.setItem(POMO_KEY,JSON.stringify(pomo))}catch(e){}
  };
  const setStrip = phase => {
    pomoStrip.classList.toggle('rest-ready',phase==='rest-pending');
    pomoStrip.classList.toggle('resting',phase==='break');
  };
  const startFocus = (autoStart=true) => {
    clearTimeout(stopTimer);
    pomo={
      phase:'focus',
      running:autoStart,
      endAt:autoStart?Date.now()+FOCUS_MS:null,
      remainingMs:FOCUS_MS
    };
    setStrip('focus');
    savePomo();
    renderPomo();
  };
  const beginBreak = () => {
    clearTimeout(stopTimer);
    if(pomo.phase!=='rest-pending' || isComposing)return;
    if(editor.value) save();
    pomo.phase='break';
    pomo.running=true;
    pomo.remainingMs=BREAK_MS;
    pomo.endAt=Date.now()+BREAK_MS;
    setStrip('break');
    savePomo();
    renderPomo();
  };
  const scheduleBreakAfterStop = () => {
    if(pomo.phase!=='rest-pending' || isComposing)return;
    clearTimeout(stopTimer);
    const elapsed=Date.now()-lastInputAt;
    const wait=Math.max(0,STOP_DELAY_MS-elapsed);
    stopTimer=setTimeout(()=>{
      if(!isComposing && pomo.phase==='rest-pending')beginBreak();
    },wait);
  };
  const enterRestPending = () => {
    clearTimeout(stopTimer);
    pomo.phase='rest-pending';
    pomo.running=false;
    pomo.endAt=null;
    pomo.remainingMs=BREAK_MS;
    setStrip('rest-pending');
    savePomo();
    renderPomo();
    scheduleBreakAfterStop();
  };
  const returnToPendingBecauseTyping = () => {
    if(pomo.phase!=='break')return;
    clearTimeout(stopTimer);
    pomo.phase='rest-pending';
    pomo.running=false;
    pomo.endAt=null;
    pomo.remainingMs=BREAK_MS;
    setStrip('rest-pending');
    savePomo();
    renderPomo();
  };
  const startPomoIfIdle = () => {
    if(pomo.phase==='rest-pending'){
      scheduleBreakAfterStop();
      return;
    }
    if(pomo.phase==='break'){
      returnToPendingBecauseTyping();
      scheduleBreakAfterStop();
      return;
    }
    if(pomo.running)return;
    if(pomo.remainingMs<=0 || pomo.remainingMs>FOCUS_MS)pomo.remainingMs=FOCUS_MS;
    pomo.running=true;
    pomo.endAt=Date.now()+pomo.remainingMs;
    savePomo();
    renderPomo();
  };
  const togglePomo = () => {
    if(pomo.phase==='rest-pending'){
      scheduleBreakAfterStop();
      return;
    }
    if(pomo.running){
      pomo.remainingMs=Math.max(0,pomo.endAt-Date.now());
      pomo.running=false;
      pomo.endAt=null;
    }else{
      if(pomo.remainingMs<=0)pomo.remainingMs=pomo.phase==='focus'?FOCUS_MS:BREAK_MS;
      pomo.running=true;
      pomo.endAt=Date.now()+pomo.remainingMs;
    }
    savePomo();
    renderPomo();
  };
  const renderPomo = () => {
    if(pomo.phase==='rest-pending'){
      pomoButton.textContent='REST READY';
      pomoButton.classList.remove('running');
      pomoButton.classList.add('breaking');
      pomoButton.setAttribute('aria-label','入力が止まると1分休憩を開始');
      setStrip('rest-pending');
      return;
    }

    let remaining=pomo.remainingMs;
    if(pomo.running && pomo.endAt)remaining=Math.max(0,pomo.endAt-Date.now());
    pomo.remainingMs=remaining;
    const label=(pomo.phase==='focus'?'FOCUS ':'REST ')+formatTimer(remaining);
    pomoButton.textContent=label;
    pomoButton.classList.toggle('running',pomo.running);
    pomoButton.classList.toggle('breaking',pomo.phase==='break');
    pomoButton.setAttribute('aria-label',`${pomo.phase==='focus'?'集中':'休憩'}タイマー ${formatTimer(remaining)} ${pomo.running?'実行中':'一時停止'}`);
    setStrip(pomo.phase);

    if(pomo.running && remaining<=0){
      if(pomo.phase==='focus')enterRestPending();
      else startFocus(true);
    }
  };
  const loadPomo = () => {
    try{
      const raw=JSON.parse(localStorage.getItem(POMO_KEY)||'null');
      if(raw && ['focus','rest-pending','break'].includes(raw.phase)){
        const maxMs=raw.phase==='focus'?FOCUS_MS:BREAK_MS;
        const rawRemaining=Number.isFinite(raw.remainingMs)?raw.remainingMs:maxMs;
        const rawEndAt=Number.isFinite(raw.endAt)?raw.endAt:null;
        const endRemaining=rawEndAt?rawEndAt-Date.now():rawRemaining;
        const migrated=rawRemaining>maxMs+5000 || (raw.phase!=='rest-pending' && endRemaining>maxMs+5000);
        pomo={
          phase:migrated?'focus':raw.phase,
          running:migrated?false:Boolean(raw.running),
          endAt:migrated?null:rawEndAt,
          remainingMs:migrated?FOCUS_MS:Math.min(maxMs,Math.max(0,rawRemaining))
        };
      }
    }catch(e){}

    if(pomo.phase==='focus' && pomo.running && pomo.endAt && Date.now()>=pomo.endAt){
      enterRestPending();
      return;
    }
    if(pomo.phase==='break' && pomo.running && pomo.endAt && Date.now()>=pomo.endAt){
      startFocus(true);
      return;
    }
    if(pomo.phase==='rest-pending')scheduleBreakAfterStop();
    renderPomo();
  };

  const showToast = (message) => {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'),3600);
  };
  const pad = n => String(n).padStart(2,'0');
  const pad3 = n => String(n).padStart(3,'0');
  const timestampName = () => {
    const d = new Date();
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${pad3(d.getMilliseconds())}`;
  };
  const b64EncodeUnicode = str => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(_,p)=>String.fromCharCode(parseInt(p,16))));
  const readLocalJson = (key,fallback={}) => {
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return fallback;
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : fallback;
    }catch(_e){
      return fallback;
    }
  };

  const syncSharedGeminiSettings = (key,model) => {
    if(!key) return;
    const resolvedModel = String(model || DEFAULTS.geminiModel).replace(/^models\//,'');
    const github = readLocalJson(SETTINGS_KEY,{});
    const nextGithub = {
      ...github,
      geminiKey:key,
      geminiModel:resolvedModel
    };
    const nextGemini = {key:key,model:resolvedModel};
    try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(nextGithub))}catch(_e){}
    try{localStorage.setItem(GEMINI_SETTINGS_KEY,JSON.stringify(nextGemini))}catch(_e){}
  };

  const loadSettings = () => {
    const github = readLocalJson(SETTINGS_KEY,{});
    const legacyGemini = readLocalJson(GEMINI_SETTINGS_KEY,{});

    // v3は zen:settings:github、v6は zen:settings:gemini を使う。
    // どちらか片方にだけAPI設定があれば自動で引き継ぐ。
    const geminiKey = github.geminiKey || legacyGemini.key || '';
    const geminiModel = github.geminiModel || legacyGemini.model || DEFAULTS.geminiModel;

    settings = {
      ...DEFAULTS,
      ...github,
      geminiKey:geminiKey,
      geminiModel:String(geminiModel || DEFAULTS.geminiModel).replace(/^models\//,'')
    };

    // 一度読み込んだら両形式へ同期し、v3/v6/v10で同じAPI設定を共有する。
    if(geminiKey) syncSharedGeminiSettings(geminiKey,settings.geminiModel);
  };
  const openSettings = () => {
    const s=settings||{};
    document.getElementById('f-token').value=s.token||'';
    document.getElementById('f-owner').value=s.owner||DEFAULTS.owner;
    document.getElementById('f-repo').value=s.repo||DEFAULTS.repo;
    document.getElementById('f-branch').value=s.branch||DEFAULTS.branch;
    document.getElementById('f-folder').value=s.folder||DEFAULTS.folder;
    document.getElementById('f-gemini-key').value=s.geminiKey||'';
    document.getElementById('f-gemini-model').value=s.geminiModel||DEFAULTS.geminiModel;
    settingsOverlay.classList.add('open');
    settingsOverlay.setAttribute('aria-hidden','false');
  };
  const closeSettings = () => {
    settingsOverlay.classList.remove('open');
    settingsOverlay.setAttribute('aria-hidden','true');
    requestAnimationFrame(()=>editor.focus());
  };
  const saveSettingsNow = () => {
    settings={
      token:document.getElementById('f-token').value.trim(),
      owner:document.getElementById('f-owner').value.trim()||DEFAULTS.owner,
      repo:document.getElementById('f-repo').value.trim()||DEFAULTS.repo,
      branch:document.getElementById('f-branch').value.trim()||DEFAULTS.branch,
      folder:(document.getElementById('f-folder').value.trim()||DEFAULTS.folder).replace(/^\/+|\/+$/g,''),
      geminiKey:document.getElementById('f-gemini-key').value.trim()||settings?.geminiKey||'',
      geminiModel:(document.getElementById('f-gemini-model').value.trim()||settings?.geminiModel||DEFAULTS.geminiModel).replace(/^models\//,'')
    };
    try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}
    if(settings.geminiKey) syncSharedGeminiSettings(settings.geminiKey,settings.geminiModel);
    closeSettings();
    setState('saved','KANA · Ctrl/⌘↵ SEND');
  };
  const send=async()=>{
    if(sending)return;
    loadSettings();
    if(!editor.value.trim()){showToast('送信する文章がありません');return;}
    if(!settings?.token){openSettings();showToast('GitHub Tokenが未設定です');return;}
    if(!settings?.geminiKey){openSettings();showToast('Gemini APIキーが必要です');return;}
    sending=true;sendButton.disabled=true;editor.readOnly=true;
    clearTimeout(saveTimer);save();
    try{
      setState('saving','GEMINI CONVERTING…');
      const source=convertRomanText(editor.value,true);
      const body=await finalizeWithGemini(source);
      setState('saving','GITHUB SENDING…');
      const folder=(settings.folder||'00_inbox').replace(/^\/+|\/+$/g,'');
      const pathname=folder+'/'+timestampName()+'.md';
      const api='https://api.github.com/repos/'+encodeURIComponent(settings.owner||DEFAULTS.owner)+'/'+
        encodeURIComponent(settings.repo||DEFAULTS.repo)+'/contents/'+pathname.split('/').map(encodeURIComponent).join('/');
      const response=await fetch(api,{
        method:'PUT',headers:{
          'Authorization':'Bearer '+settings.token,
          'Accept':'application/vnd.github+json',
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          message:'Zen v10: '+body.replace(/\s+/g,' ').slice(0,40),
          content:b64EncodeUnicode(body+'\n'),
          branch:settings.branch||DEFAULTS.branch
        })
      });
      if(!response.ok){
        const error=await response.json().catch(()=>({}));
        throw new Error(error.message||('GitHub API error '+response.status));
      }
      localStorage.removeItem(STORAGE_KEY);
      editor.value='';updateCount();
      setState('sent','SENT');
      showToast('mynotebook / '+folder+' に保存しました');
      setTimeout(()=>{if(!editor.value)setState('saved','KANA · Ctrl/⌘↵ SEND');},1800);
    }catch(error){
      console.error('Zen v10 send failed',error);
      save();setState('saved','SEND FAILED · DRAFT SAVED');
      showToast('未送信・下書き保持: '+(error?.message||String(error)));
    }finally{
      sending=false;sendButton.disabled=false;editor.readOnly=false;
      requestAnimationFrame(()=>editor.focus());
    }
  };

  // Only simple lowercase romaji -> hiragana while typing.
  const ROMA = Object.freeze({
    a:'あ',i:'い',u:'う',e:'え',o:'お',
    ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ',kya:'きゃ',kyu:'きゅ',kyo:'きょ',
    sa:'さ',shi:'し',si:'し',su:'す',se:'せ',so:'そ',sha:'しゃ',shu:'しゅ',sho:'しょ',sya:'しゃ',syu:'しゅ',syo:'しょ',
    ta:'た',chi:'ち',ti:'ち',tsu:'つ',tu:'つ',te:'て',to:'と',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',
    na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',nya:'にゃ',nyu:'にゅ',nyo:'にょ',
    ha:'は',hi:'ひ',fu:'ふ',hu:'ふ',he:'へ',ho:'ほ',hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ',fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',
    ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',mya:'みゃ',myu:'みゅ',myo:'みょ',
    ya:'や',yu:'ゆ',yo:'よ',
    ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ',rya:'りゃ',ryu:'りゅ',ryo:'りょ',
    wa:'わ',wo:'を',
    ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご',gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ',
    za:'ざ',ji:'じ',zi:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',ja:'じゃ',ju:'じゅ',jo:'じょ',jya:'じゃ',jyu:'じゅ',jyo:'じょ',
    da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど',dya:'ぢゃ',dyu:'ぢゅ',dyo:'ぢょ',
    ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',bya:'びゃ',byu:'びゅ',byo:'びょ',
    pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',
    va:'ゔぁ',vi:'ゔぃ',vu:'ゔ',ve:'ゔぇ',vo:'ゔぉ',wi:'うぃ',we:'うぇ',thi:'てぃ',dhi:'でぃ',twu:'とぅ',dwu:'どぅ',xtsu:'っ',ltsu:'っ',ltu:'っ',xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',la:'ぁ',li:'ぃ',lu:'ぅ',le:'ぇ',lo:'ぉ',xya:'ゃ',xyu:'ゅ',xyo:'ょ',lya:'ゃ',lyu:'ゅ',lyo:'ょ',she:'しぇ',che:'ちぇ',je:'じぇ'
  });
  const isVowel=c=>c!==''&&'aiueo'.includes(c);
  const isConsonant=c=>/^[a-z]$/.test(c)&&!isVowel(c);
  function toHiragana(raw,final=false){
    if(!/^[a-z]+$/.test(raw))return raw;
    let out='',i=0;
    while(i<raw.length){
      const ch=raw[i],next=raw[i+1]||'';
      if(ch==='n'){
        if(next==='n'){
          const after=raw[i+2]||'';
          if(!after){out+=final?'ん':raw.slice(i);break;}
          out+='ん';i+=isVowel(after)||after==='y'?1:2;continue;
        }
        if(!next){out+=final?'ん':'n';break;}
        if(isConsonant(next)&&next!=='y'){out+='ん';i++;continue;}
      }
      if(ch===next&&ch!=='n'&&isConsonant(ch)){
        if(i+2>=raw.length&&!final){out+=raw.slice(i);break;}
        out+='っ';i++;continue;
      }
      let found='',width=0;
      for(let len=4;len>=1;len--){
        const seq=raw.slice(i,i+len);
        if(ROMA[seq]){found=ROMA[seq];width=len;break;}
      }
      if(found){out+=found;i+=width;continue;}
      out+=raw.slice(i);break;
    }
    return out;
  }
  function convertRomanText(text,final=false){
    return text.replace(/[A-Za-z]+/g,raw=>/^[a-z]+$/.test(raw)?toHiragana(raw,final):raw);
  }
  function convertAtCaret(){
    if(isComposing||editor.selectionStart!==editor.selectionEnd)return;
    const pos=editor.selectionStart,prefix=editor.value.slice(0,pos);
    const boundary=/([a-z]+)([^A-Za-z])$/.exec(prefix);
    let from,to,kana;
    if(boundary){
      from=pos-boundary[0].length;to=from+boundary[1].length;
      kana=toHiragana(boundary[1],true);
    }else{
      const found=/[A-Za-z]+$/.exec(prefix);
      if(!found||!/^[a-z]+$/.test(found[0]))return;
      from=pos-found[0].length;to=pos;kana=toHiragana(found[0],false);
    }
    if(editor.value.slice(from,to)===kana)return;
    editor.value=editor.value.slice(0,from)+kana+editor.value.slice(to);
    editor.setSelectionRange(from+kana.length,from+kana.length);
  }

  async function flowGeminiRequest(model,prompt,apiKey){
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
      encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(apiKey);
    const res = await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt}]}],
        generationConfig:{temperature:0,maxOutputTokens:4096}
      })
    });
    if(!res.ok){
      const raw = await res.text().catch(()=> '');
      let message = 'Gemini API error (' + res.status + ')';
      try{ message = JSON.parse(raw).error?.message || message; }catch(_e){}
      const err = new Error(message);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  async function flowGeminiWithRetry(model,prompt,apiKey){
    let current = model;
    let last = null;
    for(let attempt=0;attempt<3;attempt++){
      try{
        const data = await flowGeminiRequest(current,prompt,apiKey);
        if(current !== model && settings){
          settings.geminiModel = current;
          try{ localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings)); }catch(_e){}
          if(settings.geminiKey) syncSharedGeminiSettings(settings.geminiKey,current);
        }
        return data;
      }catch(e){
        last = e;
        const replacement = /use\s+models\/([a-zA-Z0-9._-]+)/i.exec(e.message || '');
        if(replacement?.[1] && replacement[1] !== current){ current = replacement[1]; continue; }
        if([429,500,503].includes(e.status) && attempt < 2){
          await new Promise(r => setTimeout(r,650*(attempt+1)));
          continue;
        }
        throw e;
      }
    }
    throw last;
  }

  function cleanFlowResult(text){
    return String(text || '').trim();
  }


  async function finalizeWithGemini(text){
    const prompt=[
      'あなたは日本語ノートの最終表記変換器です。',
      '以下はローマ字からひらがなへ単純変換したノートです。',
      '自然な漢字かな交じり・外来語のカタカナに変換してください。',
      '明白な打鍵ミスだけ修正し、意味、文体、改行、箇条書き、固有名詞、URL、英字の略語を保持してください。',
      '要約、補足、文意の変更、勝手な意訳、説明は禁止します。',
      '結果の本文だけを返してください。',
      'ノート全文:',text
    ].join('\n');
    const data=await flowGeminiWithRetry(settings.geminiModel||DEFAULTS.geminiModel,prompt,settings.geminiKey);
    const converted=(data?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
    if(!converted)throw new Error('Geminiが変換結果を返しませんでした');
    return converted;
  }

  loadSettings();
  loadPomo();
  const restored = localStorage.getItem(STORAGE_KEY);
  if(restored){
    editor.value = restored;
    setState('saved','RESTORED');
  }

  editor.addEventListener('compositionstart',()=>{
    isComposing=true;clearTimeout(stopTimer);
    if(pomo.phase==='break')returnToPendingBecauseTyping();
  });
  editor.addEventListener('compositionend',()=>{
    isComposing=false;lastInputAt=Date.now();convertAtCaret();
    updateCount();scheduleSave();
    if(pomo.phase==='rest-pending')scheduleBreakAfterStop();
  });
  editor.addEventListener('input',()=>{
    lastInputAt=Date.now();
    if(!isComposing)convertAtCaret();
    updateCount();scheduleSave();
    if(pomo.phase==='break')returnToPendingBecauseTyping();
    if(!isComposing){
      if(pomo.phase==='rest-pending')scheduleBreakAfterStop();
      else startPomoIfIdle();
    }
  });
  document.addEventListener('keydown',event=>{
    if(!(event.metaKey||event.ctrlKey))return;
    if(event.key!=='Enter'&&event.code!=='NumpadEnter')return;
    if(event.isComposing||isComposing||event.keyCode===229)return;
    if(settingsOverlay.classList.contains('open'))return;
    event.preventDefault();event.stopPropagation();send();
  },true);
  sendButton.addEventListener('click',send);
  pomoButton.addEventListener('click',togglePomo);
  gear.addEventListener('click',openSettings);
  settingsClose.addEventListener('click',closeSettings);
  settingsSave.addEventListener('click',saveSettingsNow);
  settingsOverlay.addEventListener('click',event=>{if(event.target===settingsOverlay)closeSettings()});
  document.addEventListener('visibilitychange',() => {
    if(document.hidden && editor.value) save();
  });
  window.addEventListener('pagehide',() => {
    if(editor.value) save();
  });

  updateClock();
  updateCount();
  setInterval(updateClock,1000);
  setInterval(renderPomo,1000);
  requestAnimationFrame(() => editor.focus());
})();
</script>
