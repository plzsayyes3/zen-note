<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="禅ノート v2 縦書き">
<title>禅ノート v2 - 縦書き</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Zen+Old+Mincho:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1C1B19;--paper:#EAE4D8;--muted:#8C8577;--hairline:#33312C;--hanko:#B23A2E;--hanko-glow:rgba(178,58,46,.18);--col:30px;--step:36px}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100dvh}body{background:var(--bg);color:var(--paper);font-family:'Noto Serif JP','Zen Old Mincho',serif;overflow:hidden;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.spine{position:fixed;left:clamp(14px,3vw,36px);top:50dvh;transform:translateY(-50%);writing-mode:vertical-rl;letter-spacing:.5em;font-size:15px;color:var(--muted);opacity:.55;user-select:none;pointer-events:none}.spine .dot{display:block;width:4px;height:4px;border-radius:50%;background:var(--hanko);margin:0 auto 14px;opacity:.8}
.stage{position:fixed;left:50%;top:50dvh;width:min(680px,86vw);height:min(78dvh,620px);transform:translate(-50%,-50%);overflow:hidden;mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.18) 12%,rgba(0,0,0,.65) 30%,#000 45%,#000 55%,rgba(0,0,0,.65) 70%,rgba(0,0,0,.18) 88%,transparent 100%);-webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.18) 12%,rgba(0,0,0,.65) 30%,#000 45%,#000 55%,rgba(0,0,0,.65) 70%,rgba(0,0,0,.18) 88%,transparent 100%)}
.columns{position:absolute;top:50%;height:100%;transform:translateY(-50%);display:flex;align-items:flex-start;pointer-events:none}.column{width:var(--col);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-size:19px;line-height:var(--step);font-weight:300;white-space:pre;writing-mode:vertical-rl;text-orientation:mixed;overflow:hidden;opacity:.35;transition:opacity .12s ease}.column.active{opacity:1}.column.faded{opacity:.15}.column .ch{display:block;width:var(--col);height:var(--step);text-align:center;flex:0 0 var(--step)}
.caret-guide{position:fixed;left:50%;top:50%;width:32px;height:var(--step);transform:translate(-50%,-50%);border:1.5px solid var(--hanko);border-radius:8px;background:rgba(178,58,46,.08);opacity:.85;pointer-events:none;z-index:4}
#editor{position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;opacity:.01;border:0;outline:0;resize:none;background:transparent;color:transparent;caret-color:transparent}
.gear{position:fixed;top:calc(22px + env(safe-area-inset-top));right:calc(26px + env(safe-area-inset-right));width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.28;cursor:pointer;background:none;border:0}.gear:hover{opacity:.9;transform:rotate(35deg)}.gear svg{width:17px;height:17px}
.status{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center}.status-inner{width:min(680px,86vw);display:flex;justify-content:space-between;align-items:center;font:11px 'JetBrains Mono',monospace;color:var(--muted)}.save-hint{cursor:pointer;opacity:.75;background:none;border:0;font:inherit;color:inherit}.save-hint:disabled{opacity:.3;cursor:default}.count{opacity:.7}
.err{position:fixed;bottom:calc(52px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;pointer-events:none}.err-inner{font:11.5px 'JetBrains Mono',monospace;color:var(--hanko);background:var(--hanko-glow);padding:6px 12px;border-radius:2px;opacity:0;transition:opacity .3s}.err-inner.show{opacity:1}
.hanko-stamp{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.4) rotate(-8deg);width:104px;height:104px;border:3px solid var(--hanko);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--hanko);font-family:'Zen Old Mincho',serif;font-size:44px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 40px var(--hanko-glow)}.hanko-stamp.stamped{opacity:.92;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}.hanko-stamp.fadeout{opacity:0;transform:translate(-50%,-50%) scale(1.08) rotate(-8deg);transition:opacity .6s,transform .6s}
.overlay{position:fixed;inset:0;background:rgba(10,10,9,.72);display:none;align-items:center;justify-content:center;z-index:20}.overlay.open{display:flex}.modal{width:min(400px,88vw);background:#211F1C;border:1px solid var(--hairline);border-radius:4px;padding:28px 26px 22px;max-height:86vh;overflow-y:auto}.modal h2{font-size:15px;font-weight:400;letter-spacing:.08em;color:var(--paper);margin-bottom:4px}.modal .sub{font:10.5px 'JetBrains Mono',monospace;color:var(--muted);margin-bottom:20px}.field{margin-bottom:14px}.field label{display:block;font:10.5px 'JetBrains Mono',monospace;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}.field input{width:100%;background:#171614;border:1px solid var(--hairline);border-radius:3px;padding:9px 10px;color:var(--paper);font:12.5px 'JetBrains Mono',monospace;outline:0}.field input:focus{border-color:var(--muted)}.hint{font:10px 'JetBrains Mono',monospace;color:var(--muted);line-height:1.6;margin-top:-5px;margin-bottom:14px}.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.btn{font:11.5px 'JetBrains Mono',monospace;letter-spacing:.03em;padding:9px 16px;border-radius:3px;cursor:pointer;border:1px solid transparent}.btn-primary{background:var(--hanko);color:#F4EDE4;border-color:var(--hanko)}.btn-ghost{background:none;color:var(--muted);border-color:var(--hairline)}
@media(max-width:600px){:root{--col:28px;--step:34px}.stage{width:86vw;height:min(76dvh,560px)}.column{font-size:18px}}
</style>
</head>
<body>
<div class="spine"><span class="dot"></span>縦書き</div>
<button class="gear" id="gearBtn" title="設定" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 14a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
<div class="stage" id="stage"><div class="columns" id="columns"></div><div class="caret-guide"></div></div>
<textarea id="editor" aria-label="縦書き入力" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
<div class="status"><div class="status-inner"><span class="count" id="count">0字</span><button class="save-hint" id="saveBtn">保存 ⌘↵</button></div></div>
<div class="err"><div class="err-inner" id="err"></div></div><div class="hanko-stamp" id="stamp">禅</div>
<div class="overlay" id="overlay"><div class="modal"><h2>縦書きモード設定</h2><div class="sub">ZEN NOTE v2 / VERTICAL</div>
<div class="field"><label>GitHub Token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"></div>
<div class="field"><label>Owner</label><input id="owner" value="plzsayyes3"></div><div class="field"><label>Repository</label><input id="repo" value="mynotebook"></div><div class="field"><label>Branch</label><input id="branch" value="main"></div><div class="field"><label>File path</label><input id="path" value="01Daily/{date}.md"></div>
<div class="hint">{date} は今日の日付 (YYYY-MM-DD) に置換されます。保存時は現在の本文でファイル全体を置き換えます。</div>
<div class="modal-actions"><button class="btn btn-ghost" id="closeBtn">閉じる</button><button class="btn btn-primary" id="applyBtn">保存して閉じる</button></div></div></div>
<script>
const $=id=>document.getElementById(id),editor=$('editor'),columns=$('columns'),KEY='zen-note-v2v-settings';
const settings=Object.assign({token:'',owner:'plzsayyes3',repo:'mynotebook',branch:'main',path:'01Daily/{date}.md'},JSON.parse(localStorage.getItem(KEY)||'{}'));
function fill(){for(const k of ['token','owner','repo','branch','path'])$(k).value=settings[k]}
function readSettings(){for(const k of ['token','owner','repo','branch','path'])settings[k]=$(k).value.trim();localStorage.setItem(KEY,JSON.stringify(settings))}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pathFor(){return settings.path.replaceAll('{date}',today()).replace(/^\/+/, '')}
function maxChars(){return Math.max(5,Math.floor($('stage').clientHeight/parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--step')))}
function logicalColumns(text){const cap=maxChars(),out=[];for(const line of text.split('\n')){if(!line.length){out.push('');continue}for(let i=0;i<line.length;i+=cap)out.push(line.slice(i,i+cap))}return out.length?out:['']}
function render(){const parts=logicalColumns(editor.value),active=parts.length-1,w=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--col'));columns.innerHTML='';columns.style.width=parts.length*w+'px';columns.style.left=($('stage').clientWidth/2-active*w)+'px';parts.forEach((part,i)=>{const el=document.createElement('div');el.className='column '+(i===active?'active':'');if(active-i>5)el.classList.add('faded');for(const ch of [...part]){const s=document.createElement('span');s.className='ch';s.textContent=ch===' '?'　':ch;el.appendChild(s)}columns.appendChild(el)});$('count').textContent=[...editor.value].length+'字'}
function focus(){editor.focus({preventScroll:true})}function showErr(msg){const e=$('err');e.textContent=msg;e.classList.add('show');clearTimeout(showErr.t);showErr.t=setTimeout(()=>e.classList.remove('show'),3500)}
let stampTimer;function stamped(){const s=$('stamp');s.className='hanko-stamp stamped';clearTimeout(stampTimer);stampTimer=setTimeout(()=>s.className='hanko-stamp fadeout',800)}
function b64encode(str){return btoa(unescape(encodeURIComponent(str)))}function b64decode(str){return decodeURIComponent(escape(atob(str.replace(/\n/g,''))))}
async function api(path,opts={}){const url='https://api.github.com/repos/'+encodeURIComponent(settings.owner)+'/'+encodeURIComponent(settings.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+settings.token,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})},r=await fetch(url,{...opts,headers});if(!r.ok){let m='GitHub API '+r.status;try{const j=await r.json();m=j.message||m}catch{}throw Error(m)}return r.json()}
async function load(){if(!settings.token)return;try{const j=await api(pathFor());if(j.content){editor.value=b64decode(j.content);render()}}catch(e){if(!/404/.test(e.message))showErr('読み込み: '+e.message)}}
async function save(){if(!settings.token){$('overlay').classList.add('open');showErr('GitHub Tokenを設定してください');return}$('saveBtn').disabled=true;try{const p=pathFor();let sha;try{sha=(await api(p)).sha}catch(e){if(!/404/.test(e.message))throw e}const body={message:'zen-note v2v: save '+today(),content:b64encode(editor.value),branch:settings.branch};if(sha)body.sha=sha;await api(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});stamped();$('saveBtn').textContent='保存済み';setTimeout(()=>$('saveBtn').textContent='保存 ⌘↵',1200)}catch(e){showErr('保存失敗: '+e.message)}finally{$('saveBtn').disabled=false}}
editor.addEventListener('input',render);editor.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();save()}});$('stage').addEventListener('click',focus);$('saveBtn').addEventListener('click',save);$('gearBtn').addEventListener('click',()=>{$('overlay').classList.add('open');fill()});$('closeBtn').addEventListener('click',()=>{$('overlay').classList.remove('open');focus()});$('applyBtn').addEventListener('click',()=>{readSettings();$('overlay').classList.remove('open');load();focus()});$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')){$('overlay').classList.remove('open');focus()}});window.addEventListener('resize',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)focus()});fill();render();load();setTimeout(focus,100);
</script>
</body>
</html>
