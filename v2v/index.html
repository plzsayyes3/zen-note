<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>禅ノート v2v — 縦書き</title>
<style>
:root{--bg:#1c1b19;--paper:#eae4d8;--muted:#8c8577;--line:#33312c;--red:#b23a2e;--step:36px;--col:30px;--padY:24px}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100dvh}body{overflow:hidden;background:var(--bg);color:var(--paper);font-family:'Noto Serif JP','Zen Old Mincho',serif}
.stage{position:fixed;left:50%;top:50%;width:min(680px,86vw);height:min(78dvh,620px);transform:translate(-50%,-50%);overflow:hidden;padding:var(--padY) 0;}
.columns{position:absolute;inset:var(--padY) 0;overflow:visible;pointer-events:none}
.column{position:absolute;top:0;height:100%;width:var(--col);writing-mode:vertical-rl;text-orientation:mixed;font-size:19px;line-height:var(--step);font-weight:300;white-space:pre-wrap;overflow:visible;opacity:.32;transition:opacity .12s}.column.active{opacity:1}.column.faded{opacity:.12}.ch{display:inline}
#editor{position:absolute;inset:0;width:100%;height:100%;z-index:3;padding:0;border:0;outline:0;resize:none;background:transparent;color:transparent;caret-color:transparent;font:16px/1 sans-serif;opacity:0;cursor:text}
.gear{position:fixed;z-index:10;top:22px;right:26px;width:30px;height:30px;color:var(--muted);opacity:.35;cursor:pointer;background:none;border:0}.status{position:fixed;z-index:10;bottom:22px;left:0;right:0;display:flex;justify-content:center}.status-inner{width:min(680px,86vw);display:flex;justify-content:space-between;font:11px monospace;color:var(--muted)}.save-hint{cursor:pointer;background:none;border:0;font:inherit;color:inherit}.count{opacity:.7}
.err{position:fixed;z-index:30;bottom:52px;left:0;right:0;text-align:center;font:11px monospace;color:var(--red)}.stamp{position:fixed;z-index:25;top:50%;left:50%;width:104px;height:104px;transform:translate(-50%,-50%) scale(.4) rotate(-8deg);border:3px solid var(--red);display:flex;align-items:center;justify-content:center;color:var(--red);font-size:44px;opacity:0;pointer-events:none}.stamp.on{opacity:.92;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,10,9,.72);display:none;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(400px,88vw);background:#211f1c;border:1px solid var(--line);padding:28px 26px 22px}.modal h2{font-size:15px;font-weight:400;margin-bottom:18px}.field{margin-bottom:14px}.field label{display:block;font:10px monospace;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:9px;background:#171614;border:1px solid var(--line);color:var(--paper);font:12px monospace}.actions{display:flex;justify-content:space-between;margin-top:20px}.btn{padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted)}.primary{background:var(--red);color:#f4ede4;border-color:var(--red)}
</style>
</head>
<body>
<button class="gear" id="gear" aria-label="設定">⚙</button>
<div class="stage" id="stage"><div class="columns" id="columns"></div><textarea id="editor" aria-label="縦書き入力" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div>
<div class="status"><div class="status-inner"><span id="count">0字</span><button class="save-hint" id="save">投稿する ⌘↵</button></div></div><div class="err" id="err"></div><div class="stamp" id="stamp">済</div>
<div class="overlay" id="overlay"><div class="modal"><h2>接続設定</h2><div class="field"><label>GitHub Token</label><input id="token" type="password"></div><div class="field"><label>Owner</label><input id="owner"></div><div class="field"><label>Repository</label><input id="repo"></div><div class="field"><label>Branch</label><input id="branch"></div><div class="field"><label>保存フォルダ</label><input id="folder"></div><div class="actions"><button class="btn" id="close">閉じる</button><button class="btn primary" id="apply">保存して閉じる</button></div></div></div>
<script>
(function(){'use strict';
var $=id=>document.getElementById(id),editor=$('editor'),stage=$('stage'),columns=$('columns');
var KEY='zen:settings:github',DRAFT='zen:draft:current',settings={token:'',owner:'plzsayyes3',repo:'mynotebook',branch:'main',folder:'00_inbox'};
try{Object.assign(settings,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function fill(){['token','owner','repo','branch','folder'].forEach(k=>$(k).value=settings[k]||'')}
function readSettings(){['token','owner','repo','branch','folder'].forEach(k=>settings[k]=$(k).value.trim());settings.owner=settings.owner||'plzsayyes3';settings.repo=settings.repo||'mynotebook';settings.branch=settings.branch||'main';settings.folder=(settings.folder||'00_inbox').replace(/^\/+|\/+$/g,'');localStorage.setItem(KEY,JSON.stringify(settings))}
function cap(){return Math.max(5,Math.floor((stage.clientHeight-48)/36))}
function parts(text){var n=cap(),out=[];text.split('\n').forEach(line=>{if(!line)out.push('');else for(var i=0;i<line.length;i+=n)out.push(line.slice(i,i+n))});return out.length?out:['']}
function render(){var ps=parts(editor.value),active=ps.length-1,col=30;columns.innerHTML='';ps.forEach((part,i)=>{var c=document.createElement('div');c.className='column '+(i===active?'active ':'')+(active-i>5?'faded':'');c.style.right='calc(50% - 15px + '+((active-i)*col)+'px)';Array.from(part).forEach(ch=>{var s=document.createElement('span');s.className='ch';s.textContent=ch===' '?'　':ch;c.appendChild(s)});columns.appendChild(c)});$('count').textContent=Array.from(editor.value).length+'字'}
function focusEnd(){editor.focus({preventScroll:true});var n=editor.value.length;editor.setSelectionRange(n,n);render()}
function msg(t){$('err').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('err').textContent='',3500)}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function timestampName(){var d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
function currentText(){return editor.value}
var draftTimer=null;
function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{try{localStorage.setItem(DRAFT,currentText())}catch(e){}},900)}
function loadDraft(){try{var d=localStorage.getItem(DRAFT);if(d!==null)editor.value=d}catch(e){}}
function apiUrl(p){return 'https://api.github.com/repos/'+encodeURIComponent(settings.owner)+'/'+encodeURIComponent(settings.repo)+'/contents/'+p.split('/').map(encodeURIComponent).join('/')}
async function save(){var text=currentText();if(!text.trim())return;if(!settings.token){$('overlay').classList.add('open');fill();msg('先に接続設定を入力してください');return}$('save').disabled=true;try{var name=timestampName(),p=(settings.folder||'00_inbox')+'/'+name+'.md',u=apiUrl(p),firstLine=(text.split('\n').find(l=>l.trim())||name),body={message:'Zen: '+firstLine.slice(0,40),content:enc(text),branch:settings.branch||'main'};var r=await fetch(u,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+settings.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===401){await new Promise(x=>setTimeout(x,1000));r=await fetch(u,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+settings.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify(body)})}if(!r.ok){var j={};try{j=await r.json()}catch(e){}throw Error(j.message||'GitHub API '+r.status)}try{localStorage.removeItem(DRAFT)}catch(e){}editor.value='';render();$('stamp').className='stamp on';setTimeout(()=>$('stamp').className='stamp',800)}catch(e){msg('保存: '+e.message)}finally{$('save').disabled=false}}
editor.addEventListener('input',()=>{render();scheduleDraft()});editor.addEventListener('focus',()=>{});editor.addEventListener('blur',()=>{});stage.addEventListener('pointerdown',focusEnd);editor.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();save()}});$('save').onclick=save;$('gear').onclick=()=>{$('overlay').classList.add('open');fill()};$('close').onclick=()=>$('overlay').classList.remove('open');$('apply').onclick=()=>{readSettings();$('overlay').classList.remove('open');focusEnd()};window.onresize=render;fill();loadDraft();render();setTimeout(focusEnd,50);
})();</script></body></html>
