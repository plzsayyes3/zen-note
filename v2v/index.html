<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>禅ノート v2v — 縦書き</title>
<style>
:root{--bg:#1c1b19;--paper:#eae4d8;--muted:#8c8577;--line:#33312c;--red:#b23a2e;--step:36px;--col:30px;--padY:24px}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100dvh}body{overflow:hidden;background:var(--bg);color:var(--paper);font-family:'Noto Serif JP','Zen Old Mincho',serif}
.stage{position:fixed;left:50%;top:50%;width:min(680px,86vw);height:min(78dvh,620px);transform:translate(-50%,-50%);overflow:hidden;padding:var(--padY) 0;}
.columns{position:absolute;inset:var(--padY) 0;overflow:visible;pointer-events:none}
.column{position:absolute;top:0;height:100%;width:var(--col);writing-mode:vertical-rl;text-orientation:mixed;font-size:19px;line-height:var(--step);font-weight:300;white-space:pre-wrap;overflow:visible;opacity:.32;transition:opacity .12s}.column.active{opacity:1}.column.faded{opacity:.12}.ch{display:inline}
#editor{position:absolute;inset:0;width:100%;height:100%;z-index:3;padding:0;border:0;outline:0;resize:none;background:transparent;color:transparent;caret-color:transparent;font:16px/1 sans-serif;opacity:0;cursor:text}
.caret-guide{position:absolute;left:50%;top:var(--padY);width:20px;height:2px;transform:translateX(-50%);background:var(--paper);border:0;border-radius:0;opacity:0;pointer-events:none;z-index:4}.input-active .caret-guide{opacity:.95;animation:blink .9s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}
.gear{position:fixed;z-index:10;top:22px;right:26px;width:30px;height:30px;color:var(--muted);opacity:.35;cursor:pointer;background:none;border:0}.gear svg{width:17px;height:17px}.status{position:fixed;z-index:10;bottom:22px;left:0;right:0;display:flex;justify-content:center}.status-inner{width:min(680px,86vw);display:flex;justify-content:space-between;font:11px monospace;color:var(--muted)}.save-hint{cursor:pointer;background:none;border:0;font:inherit;color:inherit}.count{opacity:.7}
.err{position:fixed;z-index:30;bottom:52px;left:0;right:0;text-align:center;font:11px monospace;color:var(--red)}.stamp{position:fixed;z-index:25;top:50%;left:50%;width:104px;height:104px;transform:translate(-50%,-50%) scale(.4) rotate(-8deg);border:3px solid var(--red);display:flex;align-items:center;justify-content:center;color:var(--red);font-size:44px;opacity:0;pointer-events:none}.stamp.on{opacity:.92;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,10,9,.72);display:none;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(400px,88vw);background:#211f1c;border:1px solid var(--line);padding:28px 26px 22px}.modal h2{font-size:15px;font-weight:400;margin-bottom:18px}.field{margin-bottom:14px}.field label{display:block;font:10px monospace;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:9px;background:#171614;border:1px solid var(--line);color:var(--paper);font:12px monospace}.actions{display:flex;justify-content:space-between;margin-top:20px}.btn{padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted)}.primary{background:var(--red);color:#f4ede4;border-color:var(--red)}
</style>
</head>
<body>
<button class="gear" id="gear" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 1-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3.09 14H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9c-.23-.61-.82-1-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 3a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 9 6c.61-.23 1-.82 1-1.51V4a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 6c.61.23.82 1 1.51 1H17a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 15 12c.23.61.82 1 1.51 1H17a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 15 18c-.61.23-1 1-1 1.51V20a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 18a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 14c-.61.23-1.51 1-1.51 1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 10c.23-.61.82-1 1.51-1H6a2 2 0 1 1 0-4z"/></svg></button>
<div class="stage" id="stage"><div class="columns" id="columns"></div><div class="caret-guide" id="caretGuide"></div><textarea id="editor" aria-label="縦書き入力" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div>
<div class="status"><div class="status-inner"><span id="count">0字</span><button class="save-hint" id="save">保存 ⌘↵</button></div></div><div class="err" id="err"></div><div class="stamp" id="stamp">禅</div>
<div class="overlay" id="overlay"><div class="modal"><h2>縦書きモード設定</h2><div class="field"><label>GitHub Token</label><input id="token" type="password"></div><div class="field"><label>Owner</label><input id="owner"></div><div class="field"><label>Repository</label><input id="repo"></div><div class="field"><label>Branch</label><input id="branch"></div><div class="field"><label>File path</label><input id="path"></div><div class="actions"><button class="btn" id="close">閉じる</button><button class="btn primary" id="apply">保存して閉じる</button></div></div></div>
<script>
(function(){'use strict';
var $=id=>document.getElementById(id),editor=$('editor'),stage=$('stage'),columns=$('columns'),guide=$('caretGuide');
var KEY='zen-note-v2v-settings',settings={token:'',owner:'plzsayyes3',repo:'mynotebook',branch:'main',path:'01Daily/{date}.md'};
try{Object.assign(settings,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function fill(){['token','owner','repo','branch','path'].forEach(k=>$(k).value=settings[k]||'')}
function readSettings(){['token','owner','repo','branch','path'].forEach(k=>settings[k]=$(k).value.trim());localStorage.setItem(KEY,JSON.stringify(settings))}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pathFor(){return settings.path.replaceAll('{date}',today()).replace(/^\/+/, '')}
function cap(){return Math.max(5,Math.floor((stage.clientHeight-48)/36))}
function parts(text){var n=cap(),out=[];text.split('\n').forEach(line=>{if(!line)out.push('');else for(var i=0;i<line.length;i+=n)out.push(line.slice(i,i+n))});return out.length?out:['']}
function render(){var ps=parts(editor.value),active=ps.length-1,col=30;columns.innerHTML='';ps.forEach((part,i)=>{var c=document.createElement('div');c.className='column '+(i===active?'active ':'')+(active-i>5?'faded':'');c.style.left=(stage.clientWidth/2-col/2-(active-i)*col)+'px';Array.from(part).forEach(ch=>{var s=document.createElement('span');s.className='ch';s.textContent=ch===' '?'　':ch;c.appendChild(s)});columns.appendChild(c)});var current=Array.from(ps[active]||'').length;guide.style.left=(stage.clientWidth/2)+'px';guide.style.top=(24+Math.min(current,cap()-1)*36)+'px';$('count').textContent=Array.from(editor.value).length+'字'}
function focusEnd(){editor.focus({preventScroll:true});var n=editor.value.length;editor.setSelectionRange(n,n)}
function msg(t){$('err').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('err').textContent='',3500)}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}function dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
async function api(p,o={}){var u='https://api.github.com/repos/'+encodeURIComponent(settings.owner)+'/'+encodeURIComponent(settings.repo)+'/contents/'+p.split('/').map(encodeURIComponent).join('/'),h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+settings.token,'X-GitHub-Api-Version':'2022-11-28'};Object.assign(h,o.headers||{});var r=await fetch(u,Object.assign({},o,{headers:h}));if(!r.ok){var j={};try{j=await r.json()}catch(e){}throw Error(j.message||('GitHub API '+r.status))}return r.json()}
async function load(){if(!settings.token)return;try{var j=await api(pathFor());if(j.content){editor.value=dec(j.content);render()}}catch(e){if(!e.message.includes('404'))msg('読み込み: '+e.message)}}
async function save(){if(!settings.token){$('overlay').classList.add('open');return}$('save').disabled=true;try{var p=pathFor(),sha=null;try{sha=(await api(p)).sha}catch(e){if(!e.message.includes('404'))throw e}var b={message:'zen-note v2v: save '+today(),content:enc(editor.value),branch:settings.branch};if(sha)b.sha=sha;await api(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});$('stamp').className='stamp on';setTimeout(()=>$('stamp').className='stamp',800)}catch(e){msg('保存: '+e.message)}finally{$('save').disabled=false}}
editor.addEventListener('input',render);editor.addEventListener('focus',()=>document.body.classList.add('input-active'));editor.addEventListener('blur',()=>document.body.classList.remove('input-active'));stage.addEventListener('pointerdown',focusEnd);editor.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();save()}});$('save').onclick=save;$('gear').onclick=()=>{$('overlay').classList.add('open');fill()};$('close').onclick=()=>$('overlay').classList.remove('open');$('apply').onclick=()=>{readSettings();$('overlay').classList.remove('open');load();focusEnd()};window.onresize=render;fill();render();setTimeout(focusEnd,50);load();
})();
</script></body></html>
